<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Scoreboard — #ELITE</title>
<style>
@font-face{
  font-family:'Bebas Neue';
  font-style:normal;
  font-weight:400;
  font-display:swap;
  src:url(data:font/woff2;base64,{{FONT_BEBAS}}) format('woff2');
}
@font-face{
  font-family:'DM Mono';
  font-style:normal;
  font-weight:400;
  font-display:swap;
  src:url(data:font/woff2;base64,{{FONT_DMMONO400}}) format('woff2');
}
@font-face{
  font-family:'DM Mono';
  font-style:normal;
  font-weight:500;
  font-display:swap;
  src:url(data:font/woff2;base64,{{FONT_DMMONO500}}) format('woff2');
}
@font-face{
  font-family:'Inter';
  font-style:normal;
  font-weight:100 900;
  font-display:swap;
  src:url(data:font/woff2;base64,{{FONT_INTER}}) format('woff2');
}

:root{
  --bg:#eef1f7;
  --bg-tint:#f7f9fc;
  --tile:#ffffff;
  --tile-hover:#f6f8fd;
  --tile-sunken:#f4f6fb;
  --ink:#171b2e;
  --ink-dim:#5c6488;
  --ink-faint:#98a0bd;
  --border:#e3e8f3;
  --border-soft:#edf0f8;
  --red:#d5473b;
  --red-dim:#fbe6e3;
  --red-ink:#a5372e;
  --blue:#3059d6;
  --blue-dim:#e2e9fc;
  --blue-ink:#24449e;
  --pos-qb:#c96a2e;
  --pos-rb:#1f8f6f;
  --pos-wr:#7860c9;
  --pos-te:#c1508d;
  --pos-d:#5b6178;
  --good:#1f8f5b;
  --good-dim:#dcf2e6;
  --good-ink:#166b44;
  --warn:#a3791a;
  --warn-dim:#f7ecd2;
  --warn-ink:#7a5a10;
  /* Layered, wide-radius shadows read as "lifted paper" rather than the
     hard 1px outline the page had before — that flatness was most of what
     made it feel basic. */
  --shadow:0 1px 2px rgba(23,27,46,0.04), 0 4px 12px -4px rgba(23,27,46,0.06), 0 16px 32px -16px rgba(23,27,46,0.12);
  --shadow-lift:0 2px 6px rgba(23,27,46,0.06), 0 12px 28px -8px rgba(23,27,46,0.14), 0 32px 56px -24px rgba(23,27,46,0.18);
  --r-sm:10px; --r-md:14px; --r-lg:20px; --r-xl:26px;
  --ease:cubic-bezier(0.22,0.9,0.3,1);
}
:root[data-theme="dark"]{
  --bg:#0f1226;
  --tile:#181c38;
  --tile-hover:#1f2444;
  --ink:#eef0fb;
  --ink-dim:#a7addc;
  --ink-faint:#6f76a3;
  --border:#2a2f57;
  --border-soft:#232852;
  --red:#f0796d;
  --red-dim:rgba(240,121,109,0.14);
  --red-ink:#f7a89f;
  --blue:#7f9dff;
  --blue-dim:rgba(127,157,255,0.14);
  --blue-ink:#a9bdff;
  --pos-qb:#e08a4e;
  --pos-rb:#3fbf98;
  --pos-wr:#a08de8;
  --pos-te:#e17cb0;
  --pos-d:#8891b0;
  --good:#3fbf82;
  --good-dim:rgba(63,191,130,0.16);
  --good-ink:#8fe0b6;
  --warn:#e0b84e;
  --warn-dim:rgba(224,184,78,0.16);
  --warn-ink:#f0d38f;
  --shadow:0 1px 2px rgba(0,0,0,0.2), 0 8px 24px -12px rgba(0,0,0,0.4);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1024;
    --bg-tint:#131731;
    --tile:#181d3a;
    --tile-hover:#212747;
    --tile-sunken:#141833;
    --ink:#eef0fb;
    --ink-dim:#a7addc;
    --ink-faint:#7179a8;
    --border:#282e56;
    --border-soft:#222750;
    --red:#f0796d;
    --red-dim:rgba(240,121,109,0.14);
    --red-ink:#f7a89f;
    --blue:#7f9dff;
    --blue-dim:rgba(127,157,255,0.14);
    --blue-ink:#a9bdff;
    --pos-qb:#e08a4e;
    --pos-rb:#3fbf98;
    --pos-wr:#a08de8;
    --pos-te:#e17cb0;
    --pos-d:#8891b0;
    --good:#3fbf82;
    --good-dim:rgba(63,191,130,0.16);
    --good-ink:#8fe0b6;
    --warn:#e0b84e;
    --warn-dim:rgba(224,184,78,0.16);
    --warn-ink:#f0d38f;
    --shadow:0 1px 2px rgba(0,0,0,0.25), 0 4px 12px -4px rgba(0,0,0,0.3), 0 16px 32px -16px rgba(0,0,0,0.5);
    --shadow-lift:0 2px 6px rgba(0,0,0,0.3), 0 12px 28px -8px rgba(0,0,0,0.45), 0 32px 56px -24px rgba(0,0,0,0.6);
  }
}

*{ box-sizing:border-box; }
html,body{ max-width:100%; overflow-x:hidden; }
body{
  margin:0;
  /* A very soft vertical wash instead of one flat fill — reads warmer and
     gives the floating cards something to sit on. */
  background:var(--bg);
  background-image:linear-gradient(180deg, var(--bg-tint) 0%, var(--bg) 340px);
  background-attachment:fixed;
  color:var(--ink);
  font-family:'Inter',sans-serif;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
/* Numbers that change every few seconds must not reflow the row as digits
   swap — tabular figures keep every score the same width. */
.p-score, .matchup-team .score, .strip-score, .proj, .pm-points, .tk-time{ font-variant-numeric:tabular-nums; }
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{ animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; }
}
/* Deliberately narrow for a scoreboard: one matchup at a time reads best in
   a phone-ish column, and at 1180px the mirrored roster rows left ~440px of
   dead space on either side of the centre. */
.wrap{ max-width:880px; margin:0 auto; padding:22px 14px 70px; }
a{ color:var(--blue); text-decoration:none; }
::selection{ background:var(--blue-dim); }

/* ---------- Header ---------- */
header{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding-bottom:16px;
  margin-bottom:18px;
  border-bottom:1px solid var(--border);
}
.brand{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
.eyebrow{
  font-family:'DM Mono',monospace;
  font-size:11px;
  letter-spacing:2px;
  color:var(--red);
  text-transform:uppercase;
  font-weight:500;
}
h1{
  font-family:'Bebas Neue',sans-serif;
  font-weight:400;
  font-size:32px;
  letter-spacing:0.5px;
  margin:0;
  line-height:1;
  text-transform:uppercase;
}
.header-right{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.nav-link, .theme-toggle{
  font-family:'Inter',sans-serif;
  font-size:11.5px;
  font-weight:500;
  letter-spacing:0.2px;
  background:var(--tile);
  border:1px solid var(--border);
  color:var(--ink-dim);
  border-radius:999px;
  padding:7px 14px;
  cursor:pointer;
  box-shadow:0 1px 2px rgba(23,27,46,0.04);
  transition:transform 0.18s var(--ease), color 0.18s var(--ease), box-shadow 0.18s var(--ease);
}
.nav-link:hover, .theme-toggle:hover{ color:var(--ink); box-shadow:var(--shadow); transform:translateY(-1px); }
.nav-link:active, .theme-toggle:active{ transform:translateY(0); }

/* ---------- Status banner ---------- */
.banner{
  background:var(--tile);
  border:1px solid var(--border);
  border-radius:var(--r-md);
  padding:11px 15px;
  font-size:12.5px;
  font-weight:500;
  color:var(--ink-dim);
  margin-bottom:14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
  box-shadow:0 1px 2px rgba(23,27,46,0.04);
}
.banner b{ color:var(--ink); }
.banner.info{ background:var(--blue-dim); border-color:transparent; }
.refresh-note{ font-family:'DM Mono',monospace; font-size:10px; color:var(--ink-faint); white-space:nowrap; }
/* The live dot breathes so a working feed is legible at a glance, without
   demanding attention — it stops entirely once the feed goes stale. */
@keyframes livePulse{ 0%,100%{ box-shadow:0 0 0 0 var(--good-dim); } 50%{ box-shadow:0 0 0 5px transparent; } }
.dot{ display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--good); margin-right:6px; animation:livePulse 2.4s ease-in-out infinite; }
.dot.stale{ background:var(--warn); animation:none; }

/* ---------- Empty state ---------- */
.empty{
  text-align:center;
  padding:60px 20px;
  color:var(--ink-dim);
}
.empty h2{ font-family:'Bebas Neue',sans-serif; font-size:26px; color:var(--ink); margin:0 0 8px; text-transform:uppercase; }

/* ---------- Week selector ---------- */
.week-nav{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  margin-bottom:16px;
}
.week-nav button{
  width:34px; height:34px;
  border-radius:50%;
  border:1px solid var(--border);
  background:var(--tile);
  color:var(--ink-dim);
  font-size:17px;
  cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 1px 2px rgba(23,27,46,0.04);
  transition:transform 0.18s var(--ease), color 0.18s var(--ease), box-shadow 0.18s var(--ease);
}
.week-nav button:disabled{ opacity:0.3; cursor:default; }
.week-nav button:not(:disabled):hover{ color:var(--ink); box-shadow:var(--shadow); transform:translateY(-1px); }
.week-nav button:not(:disabled):active{ transform:scale(0.94); }
.week-nav select{
  font-family:'Inter',sans-serif;
  font-size:14px;
  font-weight:650;
  letter-spacing:0.2px;
  background:var(--tile);
  color:var(--ink);
  border:1px solid var(--border);
  border-radius:999px;
  padding:8px 16px;
  cursor:pointer;
  box-shadow:0 1px 2px rgba(23,27,46,0.04);
}

/* ---------- League-wide scoreboard strip ---------- */
.league-strip{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:2px 2px 4px;
  margin-bottom:16px;
  scrollbar-width:none;
}
.league-strip::-webkit-scrollbar{ display:none; }
.strip-pill{
  display:flex;
  align-items:center;
  gap:7px;
  flex-shrink:0;
  background:var(--tile);
  border:1px solid var(--border);
  border-radius:999px;
  padding:7px 13px;
  cursor:pointer;
  font-family:'Inter',sans-serif;
  font-size:12.5px;
  font-weight:600;
  color:var(--ink-dim);
  box-shadow:0 1px 2px rgba(23,27,46,0.04);
  transition:transform 0.2s var(--ease), box-shadow 0.2s var(--ease), border-color 0.2s var(--ease);
}
.strip-pill.active{ border-color:transparent; box-shadow:var(--shadow), 0 0 0 2px var(--red); }
.strip-pill:hover{ transform:translateY(-1px); box-shadow:var(--shadow); }
.strip-avatar{
  width:22px; height:22px;
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-family:'Inter',sans-serif;
  font-size:9px;
  font-weight:700;
  letter-spacing:0.2px;
  color:#fff;
  flex-shrink:0;
}
.strip-score{ font-weight:600; color:var(--ink-dim); min-width:26px; text-align:center; font-variant-numeric:tabular-nums; }
.strip-score.lead{ color:var(--good); font-weight:750; }
.strip-vs{ color:var(--ink-faint); font-size:10px; }

/* ---------- Projections / win probability ---------- */
.matchup-team .proj{ font-family:'DM Mono',monospace; font-size:10px; color:var(--ink-faint); }
.matchup-winprob{
  display:flex;
  align-items:center;
  gap:10px;
  padding:2px 16px 15px;
  font-family:'Inter',sans-serif;
  font-size:11px;
  font-weight:650;
  color:var(--ink-dim);
  font-variant-numeric:tabular-nums;
}
.matchup-winprob .wp-pct{ min-width:32px; }
.matchup-winprob .wp-pct.away{ text-align:right; }
.winprob-bar{
  flex:1;
  height:7px;
  border-radius:999px;
  overflow:hidden;
  display:flex;
  background:var(--border-soft);
  box-shadow:inset 0 1px 2px rgba(23,27,46,0.08);
}
/* Width animates so a swing in win% reads as movement, not a jump cut. */
.winprob-bar .home-fill{ background:linear-gradient(90deg, var(--blue), color-mix(in srgb, var(--blue) 78%, #fff)); transition:width 0.7s var(--ease); }
.winprob-bar .away-fill{ background:linear-gradient(90deg, color-mix(in srgb, var(--red) 78%, #fff), var(--red)); transition:width 0.7s var(--ease); }
.matchup-winprob.pending{ color:var(--ink-faint); font-weight:500; font-size:10.5px; justify-content:center; }

/* ---------- Matchup carousel ---------- */
.carousel-wrap{ position:relative; }
.carousel{
  display:flex;
  overflow-x:auto;
  scroll-snap-type:x mandatory;
  gap:14px;
  padding:2px 2px 6px;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.carousel::-webkit-scrollbar{ display:none; }
.matchup-slide{
  flex:0 0 100%;
  scroll-snap-align:center;
  min-width:0;
}
.carousel-arrow{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:36px; height:36px;
  border-radius:50%;
  border:1px solid var(--border);
  background:var(--tile);
  color:var(--ink);
  font-size:18px;
  cursor:pointer;
  box-shadow:var(--shadow);
  display:flex; align-items:center; justify-content:center;
  z-index:2;
}
.carousel-arrow.prev{ left:-14px; }
.carousel-arrow.next{ right:-14px; }
.carousel-arrow:disabled{ opacity:0; pointer-events:none; }
@media (max-width: 720px){ .carousel-arrow{ display:none; } }

.carousel-dots{
  display:flex;
  justify-content:center;
  gap:6px;
  margin-top:10px;
}
.carousel-dots .dotbtn{
  width:7px; height:7px;
  border-radius:50%;
  background:var(--border);
  border:none;
  padding:0;
  cursor:pointer;
}
.carousel-dots .dotbtn.active{ background:var(--red); width:16px; border-radius:4px; }

.matchup-card{
  background:var(--tile);
  border:1px solid var(--border);
  border-radius:var(--r-xl);
  box-shadow:var(--shadow);
  overflow:hidden;
}
.matchup-score-row{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:start;
  padding:18px 16px 15px;
  gap:10px;
  /* A soft tint behind the header separates it from the roster below
     without needing a hard rule across the card. */
  background:linear-gradient(180deg, var(--tile-sunken), transparent);
}
.matchup-team{ display:flex; flex-direction:column; gap:5px; min-width:0; }
.matchup-team.away{ align-items:flex-end; text-align:right; }
.team-id{ display:flex; align-items:center; gap:8px; min-width:0; }
.matchup-team.away .team-id{ flex-direction:row-reverse; }
.team-avatar{
  width:30px; height:30px;
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
  font-family:'Inter',sans-serif;
  font-size:11px;
  font-weight:700;
  color:#fff;
  letter-spacing:0.2px;
  box-shadow:0 2px 6px -1px rgba(23,27,46,0.25);
}
.matchup-team .name{
  font-size:13px;
  font-weight:650;
  letter-spacing:-0.1px;
  color:var(--ink-dim);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  transition:color 0.3s var(--ease);
}
.matchup-team.leading .name{ color:var(--ink); }
.matchup-team .score{
  font-family:'Inter',sans-serif;
  font-size:40px;
  font-weight:750;
  letter-spacing:-1.6px;
  color:var(--ink-faint);
  line-height:1.05;
  transition:color 0.35s var(--ease);
}
.matchup-team.leading .score{ color:var(--good); }
.matchup-vs{ margin-top:26px; }
.matchup-vs{ font-family:'DM Mono',monospace; font-size:11px; color:var(--ink-faint); letter-spacing:1px; }

/* Starter rows: one row per roster slot, home player/score on the left,
   position pill in the middle, away score/player on the right — mirrors
   both teams' lineups side by side instead of two separate stacked lists. */
.starters-table{ padding:2px 0 4px; position:relative; }
.starter-row{
  display:grid;
  grid-template-columns:1fr auto auto auto 1fr;
  align-items:center;
  gap:7px;
  padding:10px 13px;
  border-radius:var(--r-md);
  transition:background 0.2s var(--ease);
}
/* Zebra tinting instead of dividing rules: the eye tracks a row across the
   card without a grid of lines chopping it up. */
.starter-row:nth-child(even){ background:var(--tile-sunken); }
.starter-row:hover{ background:var(--tile-hover); }
.p-block{ min-width:0; }
.p-block.home{ text-align:right; }
.p-block.away{ text-align:left; }
.p-top{ display:flex; align-items:baseline; gap:5px; }
.p-block.home .p-top{ justify-content:flex-end; }
.p-block.away .p-top{ justify-content:flex-start; }
/* No max-width: the 1fr grid column already bounds these, and the old cap
   was truncating names ("Amon-Ra St. …") far earlier than it needed to. */
.p-name{
  font-size:13.5px;
  font-weight:640;
  letter-spacing:-0.15px;
  color:var(--ink);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:100%;
  display:block;
}
button.p-name, .game-link{
  background:none;
  border:none;
  padding:0;
  margin:0;
  font-family:inherit;
  text-align:inherit;
  cursor:pointer;
  transition:color 0.15s var(--ease);
}
button.p-name{ text-decoration:none; }
button.p-name:hover{ color:var(--blue); }
.p-team{
  font-family:'Inter',sans-serif;
  font-size:9.5px;
  font-weight:600;
  letter-spacing:0.3px;
  color:var(--ink-faint);
  flex-shrink:0;
}
.p-sub{ display:flex; flex-direction:column; gap:1px; margin-top:3px; }
.p-block.home .p-sub{ align-items:flex-end; }
.p-block.away .p-sub{ align-items:flex-start; }
.p-sub span, .p-sub button{
  font-family:'DM Mono',monospace;
  font-size:10px;
  color:var(--ink-faint);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:100%;
  text-decoration:none;
  display:block;
}
.p-sub button:hover{ color:var(--ink-dim); }
/* A live game gets weight and the brand red; nothing else in the row does,
   so the players still in action pop out of a full lineup at a glance. */
.p-sub .live, .p-sub button.live{ color:var(--red-ink); font-weight:600; }
.p-score{
  font-family:'Inter',sans-serif;
  font-size:19px;
  font-weight:700;
  letter-spacing:-0.6px;
  color:var(--ink);
  min-width:40px;
  text-align:center;
  transition:color 0.3s var(--ease);
}
.pos-tag{
  font-family:'Inter',sans-serif;
  font-size:9px;
  font-weight:700;
  letter-spacing:0.4px;
  padding:3px 7px;
  border-radius:999px;
  flex-shrink:0;
  min-width:28px;
  text-align:center;
}
.pos-tag.pos-QB{ background:color-mix(in srgb, var(--pos-qb) 16%, transparent); color:var(--pos-qb); }
.pos-tag.pos-RB{ background:color-mix(in srgb, var(--pos-rb) 16%, transparent); color:var(--pos-rb); }
.pos-tag.pos-WR{ background:color-mix(in srgb, var(--pos-wr) 16%, transparent); color:var(--pos-wr); }
.pos-tag.pos-TE{ background:color-mix(in srgb, var(--pos-te) 16%, transparent); color:var(--pos-te); }
.pos-tag.pos-D{ background:color-mix(in srgb, var(--pos-d) 16%, transparent); color:var(--pos-d); }
.pos-tag.pos-PK{ background:color-mix(in srgb, var(--ink-dim) 16%, transparent); color:var(--ink-dim); }

/* ---------- Player card modal ---------- */
#playerModal:empty{ display:none; }
@keyframes pmFadeIn{ from{ opacity:0; } }
@keyframes pmRiseIn{ from{ opacity:0; transform:translateY(16px) scale(0.97); } }
.pm-backdrop{
  position:fixed; inset:0;
  background:rgba(10,12,26,0.5);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  display:flex; align-items:center; justify-content:center;
  padding:20px;
  z-index:100;
  animation:pmFadeIn 0.22s var(--ease);
}
.pm-card{
  position:relative;
  background:var(--tile);
  border:1px solid var(--border);
  border-radius:var(--r-xl);
  box-shadow:var(--shadow-lift);
  padding:22px;
  width:100%;
  max-width:360px;
  animation:pmRiseIn 0.3s var(--ease);
}
.pm-close{
  position:absolute; top:10px; right:10px;
  width:28px; height:28px;
  display:flex; align-items:center; justify-content:center;
  background:var(--tile-sunken); border:none; border-radius:50%; cursor:pointer;
  font-size:17px; line-height:1; color:var(--ink-dim);
  padding:0;
  transition:background 0.18s var(--ease), color 0.18s var(--ease);
  z-index:1;
}
.pm-close:hover{ color:var(--ink); background:var(--tile-hover); }
/* Right padding keeps the points figure clear of the close button, which
   otherwise sits right on top of it. */

.pm-stats{ margin-top:6px; font-family:'DM Mono',monospace; font-size:11px; color:var(--ink-faint); line-height:1.5; }

// Demo mode runs the exact same structural-render + patch pipeline as live
// mode — it just fills `computed`, `lineup`, and the ticker with fixed data

function renderDemo(){
  const POS_PROJ = { QB: 18, RB: 12, WR: 11, TE: 8, PK: 8, D: 8 };
  const projections = {};
  const driveByName = {
    'Kenneth Walker III': { shortDownDistance: '2nd & 7', possessionText: 'SEA 41', lastPlayText: 'K.Walker rush to the SEA 41 for 6 yards.', yardLine: 41, hasBall: true },
    'Kyren Williams': { shortDownDistance: '1st & Goal', possessionText: 'DAL 8', lastPlayText: 'M.Stafford pass to K.Williams to the DAL 8 for 12 yards.', yardLine: 92, hasBall: true },

          : phase === 'in' ? Math.round((p.points + (POS_PROJ[p.pos] || 8) * 0.5) * 10) / 10

/* ---------- Theme (matches the rest of the site) ---------- */

}
function applyTheme(theme){

  else{ root.setAttribute('data-theme', theme); }

  try{ localStorage.setItem('elite-hq-theme', theme); } catch(e){}

function cycleTheme(){

}

/* ---------- Helpers ---------- */
function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function normalizeName(s){
  return String(s || '')
    .toLowerCase()
    .replace(/\./g, '')
    .replace(/\b(jr|sr|ii|iii|iv|v)\b/g, '')
    .replace(/[^a-z\s'-]/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}

function lastNameOf(normName){
  const parts = normName.split(' ');
  return parts[parts.length - 1] || '';
}

/* ---------- MFL scoring, computed client-side from ESPN stats ---------- */
// Mirrors worker/src/index.js scoreStatLine() exactly — same {event: count}
// input shape, same tiered/per-unit rule format from TYPE=rules.
function scoreStatLine(stats, fgDistances, eventRules){
  let total = 0;
  for(const [event, count] of Object.entries(stats || {})){
    const tiers = eventRules && eventRules[event];
    if(!tiers || !count) continue;
    for(const tier of tiers){
      if(count < tier.min || count > tier.max) continue;
      total += tier.perUnit ? tier.points * count : tier.points;
      if(!tier.perUnit) break;
    }
  }
  const fgTiers = eventRules && eventRules.FG;
  if(fgTiers){
    for(const dist of fgDistances || []){
      const tier = fgTiers.find((t) => dist >= t.min && dist <= t.max);
      if(tier) total += tier.points;
    }
  }
  return total;
}

/* ---------- ESPN: scoreboard + box scores ---------- */

async function espnJson(url){
  const res = await fetch(url);
  if(!res.ok) throw new Error('ESPN ' + res.status);
  return res.json();
}

// One scoreboard call for the whole NFL week gives us every game's state
// (quarter/clock/redzone/score) keyed by team abbreviation.
async function loadEspnScoreboard(nflWeek, season){
  const url = `${ESPN_SCOREBOARD}?week=${nflWeek}&year=${season}&seasontype=2`;
  const data = await espnJson(url);
  const gamesByTeam = {};
  for(const event of data.events || []){
    const comp = event.competitions && event.competitions[0];
    if(!comp) continue;
    const status = comp.status || {};
    const situation = comp.situation || {};
    const [a, b] = comp.competitors || [];
    if(!a || !b) continue;
    const build = (self, opp) => ({
      eventId: event.id,
      opponent: opp.team && opp.team.abbreviation,
      selfAbbr: self.team && self.team.abbreviation,
      quarter: status.period ?? null,
      clock: status.displayClock ?? null,
      state: status.type && status.type.state, // "pre" | "in" | "post"
      final: !!(status.type && status.type.completed),
      redZone: !!situation.isRedZone,
      teamScore: Number(self.score) || 0,
      oppScore: Number(opp.score) || 0,
      teamId: self.team && self.team.id,
      oppId: opp.team && opp.team.id,
      homeAway: self.homeAway || null,
      // Live drive situation — only present while the game is in progress.
      possessionId: situation.possession || null,
      shortDownDistance: situation.shortDownDistanceText || situation.downDistanceText || null,
      possessionText: situation.possessionText || null,
      lastPlayText: (situation.lastPlay && situation.lastPlay.text) || null,
      // Absolute 0-100 field position from ESPN; orientation is cosmetic in
      // the modal's field bar (down-and-distance text is the authoritative
      // display), so a flipped reading in a real game is a 1-line fix.
      yardLine: (typeof situation.yardLine === 'number') ? situation.yardLine : null,
    });
    if(a.team && a.team.abbreviation) gamesByTeam[a.team.abbreviation] = build(a, b);
    if(b.team && b.team.abbreviation) gamesByTeam[b.team.abbreviation] = build(b, a);
  }
  return gamesByTeam;
}

// Field goals are scored by distance tier, but ESPN's box score only gives
// an aggregate "made/attempted" string — so distances come from the play
// log instead, matched back to the kicker by the "X.Lastname" in the text.
function extractFieldGoalPlays(summary){
  const drives = (summary.drives && summary.drives.previous) || [];
  const kicks = [];
  for(const drive of drives){
    for(const play of (drive.plays || [])){
      const typeText = play.type && play.type.text;
      if(typeText !== 'Field Goal Good') continue;
      const desc = play.text || '';
      const nameMatch = desc.match(/^([A-Z][A-Za-z'-]*\.?\s?[A-Z][A-Za-z'-]+)/);
      const distMatch = desc.match(/(\d+)\s+yard field goal/i);
      const distance = play.statYardage != null ? Number(play.statYardage) : (distMatch ? Number(distMatch[1]) : null);
      if(distance != null) kicks.push({ rawName: nameMatch ? nameMatch[1] : '', distance });
    }
  }
  return kicks;
}

// Builds a per-player stat index for one game: normalized name -> merged
// {labelValue(category,label)} lookup across every stat category ESPN
// returns for that player (a WR can show up under both receiving and
// rushing, etc).
function buildPlayerIndex(summary){
  const index = {}; // normName -> { categories: {name: {labels, values}}, teamAbbr }
  const teamEntries = (summary.boxscore && summary.boxscore.players) || [];
  for(const teamEntry of teamEntries){
    const teamAbbr = teamEntry.team && teamEntry.team.abbreviation;
    for(const cat of teamEntry.statistics || []){
      for(const ath of cat.athletes || []){
        const displayName = ath.athlete && ath.athlete.displayName;
        if(!displayName) continue;
        const key = normalizeName(displayName);
        if(!index[key]) index[key] = { categories: {}, teamAbbr, athleteId: (ath.athlete && ath.athlete.id) || null };
        index[key].categories[cat.name] = { labels: cat.labels || [], values: ath.stats || [] };
      }
    }
  }
  return index;
}

function labelValue(categories, catName, label){
  const cat = categories[catName];
  if(!cat) return null;
  const idx = cat.labels.indexOf(label);
  if(idx === -1) return null;
  return cat.values[idx];
}

function findPlayer(index, mflName){
  const norm = normalizeName(mflName);
  if(index[norm]) return index[norm];
  // Fallback: last name + first-initial match, for minor formatting drift
  // between MFL's "Firstname Lastname" and ESPN's displayName.
  const [first, ...rest] = norm.split(' ');
  const last = rest[rest.length - 1] || first;
  const firstInitial = (first || '')[0];
  for(const key of Object.keys(index)){
    if(lastNameOf(key) === last && key[0] === firstInitial) return index[key];
  }
  return null;
}

// Offense (QB/RB/WR/TE/PK): computed directly from the player's own box
// score stat lines. FG/EP handled separately since MFL scores them by
// distance/count rather than a simple per-yard rate.
function offenseStats(categories){
  const stats = {};
  const num = (v) => { const n = Number(v); return Number.isFinite(n) ? n : 0; };
  const passYds = num(labelValue(categories, 'passing', 'YDS'));
  const passTD = num(labelValue(categories, 'passing', 'TD'));
  const passInt = num(labelValue(categories, 'passing', 'INT'));
  if(passYds) stats.PY = passYds;
  if(passTD) stats['#P'] = passTD;
  if(passInt) stats.IN = passInt;

  const rushYds = num(labelValue(categories, 'rushing', 'YDS'));
  const rushTD = num(labelValue(categories, 'rushing', 'TD'));
  if(rushYds) stats.RY = rushYds;
  if(rushTD) stats['#R'] = rushTD;

  const rec = num(labelValue(categories, 'receiving', 'REC'));
  const recYds = num(labelValue(categories, 'receiving', 'YDS'));
  const recTD = num(labelValue(categories, 'receiving', 'TD'));
  if(rec) stats.CC = rec;
  if(recYds) stats.CY = recYds;
  if(recTD) stats['#C'] = recTD;

  const fumLost = num(labelValue(categories, 'fumbles', 'LOST'));
  if(fumLost) stats.FL = fumLost;

  const krTD = num(labelValue(categories, 'kickReturns', 'TD'));
  const prTD = num(labelValue(categories, 'puntReturns', 'TD'));
  if(krTD) stats['#KT'] = krTD;
  if(prTD) stats['#UT'] = prTD;

  return stats;
}

// Defensive and special-teams scores (SF/#T/BLF/BLP/BLE) aren't per-team
// fields in ESPN's box score, so they're counted off the scoring-play list
// instead — the same feed the league ticker uses. Each play is attributed to
// the team credited with the score, and only return/defensive scores count:
// an offensive TD is matched by its "pass from"/"run" phrasing and skipped.
// Blocked kicks only surface here when the block itself produced the score;
// a block recovered without a score isn't in this feed and stays uncounted.
function defenseSpecialStats(summary, teamId){
  const out = {};
  for(const play of summary.scoringPlays || []){
    if(!play.team || String(play.team.id) !== String(teamId)) continue;
    const text = ((play.type && play.type.text) || '') + ' ' + (play.text || '');
    if(/safety/i.test(text)){ out.SF = (out.SF || 0) + 1; continue; }
    const isTd = /touchdown|\bTD\b/i.test(text) || (play.scoringType && play.scoringType.name === 'touchdown');
    if(!isTd) continue;
    if(/\bpass from\b|\bpass to\b/i.test(text)) continue;   // offensive passing TD
    if(/\b\d+\s*(yd|yard)s?\s+run\b/i.test(text)) continue; // offensive rushing TD
    if(/interception return|fumble return|blocked|kickoff return|punt return|return touchdown|recovery in the end zone/i.test(text)){
      out['#T'] = (out['#T'] || 0) + 1;
      if(/blocked field goal/i.test(text)) out.BLF = (out.BLF || 0) + 1;
      else if(/blocked punt/i.test(text)) out.BLP = (out.BLP || 0) + 1;
      else if(/blocked extra point|blocked pat/i.test(text)) out.BLE = (out.BLE || 0) + 1;
    }
  }
  return out;
}

// Defense (Def/DST slot). Points-allowed, sacks and interceptions come
// straight out of ESPN's structured box score, so those are exact. Fumble
// recoveries are derived from the opposing team's "fumbles LOST" — a fumble
// the offense loses is by definition one this defense recovered — which is a
// cleaner read than trying to attribute recoveries player by player.
function defenseStats(summary, teamAbbr, teamId, oppScore){
  const stats = {};
  const teamEntries = (summary.boxscore && summary.boxscore.players) || [];
  const teamEntry = teamEntries.find((t) => (t.team && (t.team.id === teamId || t.team.abbreviation === teamAbbr)));
  const catByName = {};
  for(const cat of (teamEntry && teamEntry.statistics) || []) catByName[cat.name] = cat;
  const sumLabel = (catName, label) => {
    const cat = catByName[catName];
    if(!cat) return 0;
    const idx = cat.labels.indexOf(label);
    if(idx === -1) return 0;
    let sum = 0;
    for(const ath of cat.athletes || []){
      const v = parseFloat(ath.stats && ath.stats[idx]);
      if(!Number.isNaN(v)) sum += v;
    }
    return sum;
  };
  const sacks = sumLabel('defensive', 'SACKS');
  if(sacks) stats.SK = sacks;
  const picks = sumLabel('interceptions', 'INT');
  if(picks) stats.IC = picks;

  // Fumbles this defense recovered = fumbles the other side lost.
  const oppEntry = teamEntries.find((t) => t.team && t.team.id !== teamId && t.team.abbreviation !== teamAbbr);
  if(oppEntry){
    const fumCat = (oppEntry.statistics || []).find((c) => c.name === 'fumbles');
    if(fumCat){
      const idx = (fumCat.labels || []).indexOf('LOST');
      if(idx !== -1){
        let lost = 0;
        for(const ath of fumCat.athletes || []){
          const v = parseFloat(ath.stats && ath.stats[idx]);
          if(!Number.isNaN(v)) lost += v;
        }
        if(lost) stats.FC = lost;
      }
    }
  }

  Object.assign(stats, defenseSpecialStats(summary, teamId));
  if(oppScore != null) stats.TPA = oppScore; // tiered range lookup happens in scoreStatLine via FG-style bare-number ranges
  return stats;
}

// Turns the raw {EVENT_CODE: count} stat object into a short human-readable
// line, e.g. "257 YD, 3 TD, 1 INT" or "3 SACK, 1 INT, 24 PA". Offense and
// defense codes never overlap on one player, so one formatter covers both.
function formatStatSummary(stats){
  if(!stats) return '';
  const parts = [];
  const round = (n) => Math.round(n * 10) / 10;
  if(stats._FG) parts.push(stats._FG + ' FG');
  if(stats.PY) parts.push(round(stats.PY) + ' YD');
  if(stats['#P']) parts.push(stats['#P'] + ' TD');
  if(stats.IN) parts.push(stats.IN + ' INT');
  if(stats.RY) parts.push(round(stats.RY) + ' YD');
  if(stats['#R']) parts.push(stats['#R'] + ' TD');
  if(stats.CC) parts.push(stats.CC + ' REC');
  if(stats.CY) parts.push(round(stats.CY) + ' YD');
  if(stats['#C']) parts.push(stats['#C'] + ' TD');
  if(stats.FL) parts.push(stats.FL + ' FUM');
  if(stats.EP) parts.push(stats.EP + ' XP');
  if(stats.SK) parts.push(stats.SK + ' SACK');
  if(stats.IC) parts.push(stats.IC + ' INT');
  if(stats.FC) parts.push(stats.FC + ' FR');
  if(stats['#T']) parts.push(stats['#T'] + ' DEF TD');
  if(stats.SF) parts.push(stats.SF + ' SAF');
  const blocks = (stats.BLF || 0) + (stats.BLP || 0) + (stats.BLE || 0);
  if(blocks) parts.push(blocks + ' BLK');
  if(stats.TPA != null) parts.push(stats.TPA + ' PA');
  return parts.join(', ');
}

// The small gray line under a player's name: live clock, final score, or
// pregame — same shape whether it's a real ESPN game object or demo data.
// While the player's own offense has the ball, the down-and-distance rides
// along ("Q3 8:42 · 2nd & 7") so you can see the drive from the matchup row.
function gameContextText(game){
  if(!game) return '';
  if(game.final) return `Final · ${game.teamScore}-${game.oppScore}`;
  if(game.state === 'pre') return 'Pregame';
  if(game.state === 'in'){
    const rz = game.redZone ? '● ' : '';
    let t = rz + 'Q' + (game.quarter ?? '?') + ' ' + (game.clock ?? '');
    if(gameHasBall(game) && game.shortDownDistance) t += ' · ' + game.shortDownDistance;
    return t;
  }
  return '';
}

function gameHasBall(game){
  return !!(game && game.state === 'in' && game.possessionId && game.possessionId === game.teamId);
}

// Fraction of this player's game still to be played (1 = hasn't kicked off,
// 0 = final) — feeds live-adjusted projections and the win-probability
// model. Overtime counts as a small nonzero remainder.
function fracRemaining(game){
  if(!game || game.state === 'pre') return 1;
  if(game.final || game.state === 'post') return 0;
  if(game.state === 'in'){
    const q = game.quarter ?? 1;
    const [mm, ss] = String(game.clock || '0:00').split(':').map(Number);
    const secLeftQ = (Number.isFinite(mm) ? mm * 60 : 0) + (Number.isFinite(ss) ? ss : 0);
    if(q > 4) return Math.max(0.01, Math.min(0.06, secLeftQ / 3600));
    return Math.max(0, Math.min(1, ((4 - q) * 900 + secLeftQ) / 3600));
  }
  return 1;
}

/* ---------- Per-player point computation ---------- */
function computePoints(player, gamesByTeam, rules){
  const espnAbbr = player.nflTeam ? (MFL_TO_ESPN_TEAM[player.nflTeam] || player.nflTeam) : null;
  const game = espnAbbr ? gamesByTeam[espnAbbr] : null;
  const ruleKey = POS_TO_RULE_KEY[player.pos] || player.pos;
  const eventRules = rules && rules[ruleKey];
  const result = {
    points: 0,
    game: game || null,
    contextText: gameContextText(game),
    contextLive: !!(game && game.state === 'in'),
    statLine: '',
    phase: game ? (game.state === 'in' ? 'in' : (game.final || game.state === 'post') ? 'post' : 'pre') : 'idle',
    frac: fracRemaining(game),
    hasBall: gameHasBall(game),
  };
  if(!game || !game.eventId || !eventRules) return result;

  const box = espnCache.boxByEvent[game.eventId];
  if(!box) return result; // box score for this game hasn't loaded yet

  if(player.pos === 'D'){
    const stats = defenseStats(box.summary, espnAbbr, game.teamId, game.oppScore);
    result.points = scoreStatLine(stats, [], eventRules);
    result.statLine = formatStatSummary(stats);
    return result;
  }

  const rec = findPlayer(box.playerIndex, player.name);
  if(!rec) return result; // inactive, bye, or a name we couldn't match

  const stats = offenseStats(rec.categories);
  const fgDistances = [];
  if(player.pos === 'PK'){
    const xp = Number(labelValue(rec.categories, 'kicking', 'XP')?.split('/')[0]) || 0;
    if(xp) stats.EP = xp;
    const kicks = box.fieldGoals.filter((k) => lastNameOf(normalizeName(k.rawName)) === lastNameOf(normalizeName(player.name)));
    fgDistances.push(...kicks.map((k) => k.distance));
    if(fgDistances.length) stats._FG = fgDistances.length; // display-only, not a scoring event
  }
  result.points = scoreStatLine(stats, fgDistances, eventRules);
  result.statLine = formatStatSummary(stats);
  return result;
}

/* ---------- State ---------- */
let lineup = null;          // last /api/live-scores payload (or its demo equivalent)
let currentWeek = null;
let slideIndex = 0;
let computed = {};          // player id -> computePoints() result
let demoMode = false;
let structuralKey = null;   // week + roster ids; a change means rebuild the DOM
let playerRegistry = {};    // player id -> {id, name, pos, nflTeam}, rebuilt each structural render
let openPid = null;         // player card currently open, kept live-updated by patches
let firstPatchDone = false; // suppress the score-flash animation on the very first paint
let tickerEvents = [];      // league feed, newest first
let tickerOpen = true;
let tickerPrimed = false;   // backlog harvested on first load doesn't animate
let rosterIndex = [];       // normalized roster names for matching scoring-play text
const seenPlays = new Set();

function allPlayersIn(matchups){
  const out = [];
  for(const m of matchups || []){
    for(const side of [m.home, m.away]){
      for(const p of side.starters || []) out.push({ ...p, owner: side.team });
      for(const p of side.bench || []) out.push({ ...p, owner: side.team });
    }
  }
  return out;
}

/* ---------- Live projections + win probability ---------- */
// A player's live projection: points already scored plus the remaining share
// of their pregame MFL projection, scaled by how much of their game is left
// — the same model Sleeper/ESPN use for the in-game "proj" column.
function livePlayerProj(p){
  const c = computed[p.id];
  const pts = (c && c.points) || 0;
  const base = lineup && lineup.projections ? lineup.projections[p.id] : null;
  const frac = c ? c.frac : 1;
  if(base == null) return { proj: pts, frac };
  return { proj: pts + base * frac, frac };
}

function teamLiveTotals(team){
  let points = 0, proj = 0, fracSum = 0, n = 0, pre = 0, live = 0, done = 0;
  for(const p of team.starters || []){
    const c = computed[p.id];
    points += (c && c.points) || 0;
    const lp = livePlayerProj(p);
    proj += lp.proj; fracSum += lp.frac; n++;
    const phase = c ? c.phase : 'idle';
    if(phase === 'pre') pre++;
    else if(phase === 'in') live++;
    else done++; // post, plus idle (bye / no game found): nothing left to come
  }
  return { points, proj, fracRemaining: n ? fracSum / n : 0, pre, live, done };
}

// Win probability via a normal approximation on the projected final margin:
// mean = live-proj differential, sd shrinks with the square root of how much
// of the combined games is left (~26 pts is a typical full-week matchup-
// margin sd). The logistic curve stands in for the normal CDF. Once every
// game is final the actual score decides it outright.
function matchupWinProb(h, a){
  const frac = (h.fracRemaining + a.fracRemaining) / 2;
  if(frac <= 0.001){
    if(h.points === a.points) return 50;
    return h.points > a.points ? 100 : 0;
  }
  const sigma = Math.max(1.5, 26 * Math.sqrt(frac));
  const p = 1 / (1 + Math.exp(-1.702 * ((h.proj - a.proj) / sigma)));
  return Math.min(99, Math.max(1, Math.round(p * 100)));
}

/* ---------- Structural rendering (once per lineup/week change) ---------- */
function initials(name){
  const words = String(name || '').split(/\s+/).filter(Boolean);
  return (words.map((w) => w[0]).join('').slice(0, 2) || '?').toUpperCase();
}
function avatarColor(name){
  let hash = 0;
  for(let i = 0; i < name.length; i++) hash = (hash * 31 + name.charCodeAt(i)) >>> 0;
  return `hsl(${hash % 360} 50% 42%)`;
}

// The structural pass renders shells with data attributes; every dynamic
// value (scores, clocks, stat lines, projections, win%) is patched into
// place afterwards without rebuilding the DOM, so a mid-swipe update never
// stutters the carousel.
function playerBlock(p, side){
  playerRegistry[p.id] = p;
  const nameEl = `<button type="button" class="p-name js-player-card" data-player-id="${escapeHtml(p.id)}">${escapeHtml(p.name)}</button>`;
  const teamEl = `<span class="p-team">${escapeHtml(p.nflTeam || '')}</span>`;
  const top = side === 'home' ? nameEl + teamEl : teamEl + nameEl;
  return `<div class="p-block ${side}">
    <div class="p-top">${top}</div>
    <div class="p-sub">
      <button type="button" class="game-link js-player-card" data-ctx="${escapeHtml(p.id)}" data-player-id="${escapeHtml(p.id)}" hidden></button>
      <span data-stat="${escapeHtml(p.id)}" hidden></span>
    </div>
  </div>`;
}

function starterRow(homePlayer, awayPlayer){
  const pos = (homePlayer || awayPlayer).pos || '';
  const scoreEl = (p) => p
    ? `<span class="p-score" data-score="${escapeHtml(p.id)}">0.0</span>`
    : '<span class="p-score">&mdash;</span>';
  return `<div class="starter-row">
    ${homePlayer ? playerBlock(homePlayer, 'home') : '<div class="p-block home"></div>'}
    ${scoreEl(homePlayer)}
    <span class="pos-tag pos-${escapeHtml(pos)}">${escapeHtml(pos)}</span>
    ${scoreEl(awayPlayer)}
    ${awayPlayer ? playerBlock(awayPlayer, 'away') : '<div class="p-block away"></div>'}
  </div>`;
}

function renderMatchup(m, i){
  // No confirmed lineups yet (preseason / between weeks): the worker sends
  // whole rosters with no starters, so say that plainly instead of dressing
  // a roster up as a set lineup.
  const unset = lineup && lineup.lineupConfirmed === false;
  const rowCount = Math.max(m.home.starters.length, m.away.starters.length);
  const rows = Array.from({ length: rowCount }, (_, r) => starterRow(m.home.starters[r], m.away.starters[r])).join('');
  const benchCount = Math.max((m.home.bench || []).length, (m.away.bench || []).length);
  const benchRows = benchCount
    ? Array.from({ length: benchCount }, (_, r) => starterRow((m.home.bench || [])[r], (m.away.bench || [])[r])).join('')
    : '';
  const teamHtml = (side, key) => `
      <div class="matchup-team ${key}" data-mteam="${i}-${key}">
        <div class="team-id">
          <span class="team-avatar" style="background:${avatarColor(side.team)}">${escapeHtml(initials(side.team))}</span>
          <span class="name">${escapeHtml(side.team)}</span>
        </div>
        <span class="score" data-tscore="${i}-${key}">0.0</span>
        <span class="proj" data-tproj="${i}-${key}"></span>
        <div class="team-ytp" data-ytp="${i}-${key}"></div>
      </div>`;
  return `<div class="matchup-slide"><div class="matchup-card">
    <div class="matchup-score-row">
      ${teamHtml(m.home, 'home')}
      <span class="matchup-vs">VS</span>
      ${teamHtml(m.away, 'away')}
    </div>
    <div data-wp="${i}"></div>
    <div class="starters-table">${rows || '<div class="starter-row">No starters yet</div>'}</div>
    ${benchRows ? `<button type="button" class="bench-toggle" data-benchtoggle="${i}">${unset ? 'Roster' : 'Bench'} &darr;</button>
    <div class="bench-rows" data-bench="${i}"${unset ? '' : ' hidden'}>${benchRows}</div>` : ''}
  </div></div>`;
}

function renderLeagueStrip(matchups){
  const strip = document.getElementById('leagueStrip');
  if(!matchups.length){ strip.innerHTML = ''; return; }
  strip.innerHTML = `<div class="league-strip">${matchups.map((m, i) => `
    <button class="strip-pill${i === slideIndex ? ' active' : ''}" data-i="${i}">
      <span class="strip-avatar" style="background:${avatarColor(m.home.team)}">${escapeHtml(initials(m.home.team))}</span>
      <span class="strip-score" data-strip="${i}-home">0.0</span>
      <span class="strip-vs">&middot;</span>
      <span class="strip-score" data-strip="${i}-away">0.0</span>
      <span class="strip-avatar" style="background:${avatarColor(m.away.team)}">${escapeHtml(initials(m.away.team))}</span>
    </button>`).join('')}</div>`;
  strip.querySelectorAll('.strip-pill').forEach((btn) => {
    btn.onclick = () => scrollToSlide(Number(btn.dataset.i));
  });
}

// Shared by the league strip, the carousel's own dots, and its arrows —
// whichever one triggers navigation, all three stay in sync.
function scrollToSlide(i){
  const carouselEl = document.getElementById('carousel');
  if(!carouselEl) return;
  const slides = carouselEl.querySelectorAll('.matchup-slide');
  if(!slides.length) return;
  slideIndex = Math.max(0, Math.min(slides.length - 1, i));
  slides[slideIndex].scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
  document.querySelectorAll('.dotbtn').forEach((b, idx) => b.classList.toggle('active', idx === slideIndex));
  document.querySelectorAll('.strip-pill').forEach((b, idx) => b.classList.toggle('active', idx === slideIndex));
}

function renderWeekNav(data){
  const nav = document.getElementById('weekNav');
  if(!data.totalWeeks){ nav.innerHTML = ''; return; }
  const options = Array.from({length: data.totalWeeks}, (_, i) => i + 1)
    .map((w) => `<option value="${w}"${w === data.week ? ' selected' : ''}>Week ${w}</option>`)
    .join('');
  nav.innerHTML = `<div class="week-nav">
    <button id="weekPrev" ${data.week <= 1 ? 'disabled' : ''}>&lsaquo;</button>
    <select id="weekSelect">${options}</select>
    <button id="weekNext" ${data.week >= data.totalWeeks ? 'disabled' : ''}>&rsaquo;</button>
  </div>`;
  document.getElementById('weekPrev').onclick = () => loadWeek(data.week - 1);
  document.getElementById('weekNext').onclick = () => loadWeek(data.week + 1);
  document.getElementById('weekSelect').onchange = (e) => loadWeek(Number(e.target.value));
}

function renderCarousel(matchups){
  const contentEl = document.getElementById('content');
  if(!matchups.length){
    contentEl.innerHTML = `<div class="empty"><h2>No matchups to show yet</h2><p>Check back once the week's games are set.</p></div>`;
    return;
  }
  const dots = matchups.map((_, i) => `<button class="dotbtn${i === slideIndex ? ' active' : ''}" data-i="${i}"></button>`).join('');
  contentEl.innerHTML = `<div class="carousel-wrap">
    <button class="carousel-arrow prev" id="arrowPrev">&lsaquo;</button>
    <div class="carousel" id="carousel">${matchups.map((m, i) => renderMatchup(m, i)).join('')}</div>
    <button class="carousel-arrow next" id="arrowNext">&rsaquo;</button>
  </div>
  ${matchups.length > 1 ? `<div class="carousel-dots">${dots}</div>` : ''}`;

  const carouselEl = document.getElementById('carousel');
  const slides = carouselEl.querySelectorAll('.matchup-slide');
  document.getElementById('arrowPrev').onclick = () => scrollToSlide(slideIndex - 1);
  document.getElementById('arrowNext').onclick = () => scrollToSlide(slideIndex + 1);
  document.querySelectorAll('.dotbtn').forEach((btn) => {
    btn.onclick = () => scrollToSlide(Number(btn.dataset.i));
  });
  contentEl.querySelectorAll('.bench-toggle').forEach((btn) => {
    btn.onclick = () => {
      const rowsEl = contentEl.querySelector(`[data-bench="${btn.dataset.benchtoggle}"]`);
      if(!rowsEl) return;
      rowsEl.hidden = !rowsEl.hidden;
      btn.innerHTML = rowsEl.hidden ? 'Bench &darr;' : 'Bench &uarr;';
    };
  });
  let scrollTimer;
  carouselEl.onscroll = () => {
    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(() => {
      const mid = carouselEl.scrollLeft + carouselEl.clientWidth / 2;
      let closest = 0, closestDist = Infinity;
      slides.forEach((s, i) => {
        const dist = Math.abs((s.offsetLeft + s.clientWidth / 2) - mid);
        if(dist < closestDist){ closestDist = dist; closest = i; }
      });
      if(closest !== slideIndex){
        slideIndex = closest;
        document.querySelectorAll('.dotbtn').forEach((b, i) => b.classList.toggle('active', i === slideIndex));
        document.querySelectorAll('.strip-pill').forEach((b, i) => b.classList.toggle('active', i === slideIndex));
      }
    }, 100);
  };
  scrollToSlide(Math.min(slideIndex, matchups.length - 1));
}

function buildRosterIndex(matchups){
  rosterIndex = allPlayersIn(matchups).map((p) => {
    const norm = normalizeName(p.name);
    return { pid: p.id, name: p.name, owner: p.owner, norm };
  });
}

function renderStructure(){
  playerRegistry = {};
  firstPatchDone = false;
  const matchups = (lineup && lineup.matchups) || [];
  buildRosterIndex(matchups);
  renderLeagueStrip(matchups);
  renderCarousel(matchups);
  renderTickerFull(0);
}

/* ---------- In-place patching (every data refresh) ---------- */
function setLiveText(el, text, flash){
  if(!el) return;
  if(el.textContent !== text){
    el.textContent = text;
    if(flash && firstPatchDone){
      el.classList.remove('flash');
      void el.offsetWidth; // restart the animation
      el.classList.add('flash');
    }
  }
}

function ytpHtml(t){
  const parts = [];
  if(t.live) parts.push(`<span class="live">${t.live} live</span>`);
  if(t.pre) parts.push(`${t.pre} to play`);
  if(t.done) parts.push(`${t.done} done`);
  return parts.join(' &middot; ');
}

function winProbHtml(h, a){
  if(!lineup || !lineup.projections){
    return `<div class="matchup-winprob pending">Win% needs projections &mdash; waiting on MFL data</div>`;
  }
  const homePct = matchupWinProb(h, a);
  const awayPct = 100 - homePct;
  return `<div class="matchup-winprob">
    <span class="wp-pct home">${homePct}%</span>
    <div class="winprob-bar"><span class="home-fill" style="width:${homePct}%"></span><span class="away-fill" style="width:${awayPct}%"></span></div>
    <span class="wp-pct away">${awayPct}%</span>
  </div>`;
}

function patchDynamic(){
  if(!lineup) return;
  const matchups = lineup.matchups || [];
  const hasProj = !!lineup.projections;

  for(const p of allPlayersIn(matchups)){
    const c = computed[p.id] || {};
    setLiveText(document.querySelector(`[data-score="${p.id}"]`), ((c.points || 0)).toFixed(1), true);
    const ctxEl = document.querySelector(`[data-ctx="${p.id}"]`);
    if(ctxEl){
      const txt = c.contextText || '';
      ctxEl.hidden = !txt;
      if(ctxEl.textContent !== txt) ctxEl.textContent = txt;
      ctxEl.classList.toggle('live', !!c.contextLive);
    }
    const statEl = document.querySelector(`[data-stat="${p.id}"]`);
    if(statEl){
      const txt = c.statLine || '';
      statEl.hidden = !txt;
      if(statEl.textContent !== txt) statEl.textContent = txt;
    }
  }

  matchups.forEach((m, i) => {
    const h = teamLiveTotals(m.home);
    const a = teamLiveTotals(m.away);
    setLiveText(document.querySelector(`[data-tscore="${i}-home"]`), h.points.toFixed(1), true);
    setLiveText(document.querySelector(`[data-tscore="${i}-away"]`), a.points.toFixed(1), true);
    setLiveText(document.querySelector(`[data-strip="${i}-home"]`), h.points.toFixed(1), true);
    setLiveText(document.querySelector(`[data-strip="${i}-away"]`), a.points.toFixed(1), true);
    const homeTeamEl = document.querySelector(`[data-mteam="${i}-home"]`);
    const awayTeamEl = document.querySelector(`[data-mteam="${i}-away"]`);
    if(homeTeamEl) homeTeamEl.classList.toggle('leading', h.points > a.points);
    if(awayTeamEl) awayTeamEl.classList.toggle('leading', a.points > h.points);
    const stripHome = document.querySelector(`[data-strip="${i}-home"]`);
    const stripAway = document.querySelector(`[data-strip="${i}-away"]`);
    if(stripHome) stripHome.classList.toggle('lead', h.points > a.points);
    if(stripAway) stripAway.classList.toggle('lead', a.points > h.points);
    const projHome = document.querySelector(`[data-tproj="${i}-home"]`);
    const projAway = document.querySelector(`[data-tproj="${i}-away"]`);
    if(projHome) projHome.textContent = hasProj ? `Proj ${h.proj.toFixed(1)}` : '';
    if(projAway) projAway.textContent = hasProj ? `Proj ${a.proj.toFixed(1)}` : '';
    const ytpHome = document.querySelector(`[data-ytp="${i}-home"]`);
    const ytpAway = document.querySelector(`[data-ytp="${i}-away"]`);
    if(ytpHome) ytpHome.innerHTML = ytpHtml(h);
    if(ytpAway) ytpAway.innerHTML = ytpHtml(a);
    const wpEl = document.querySelector(`[data-wp="${i}"]`);
    if(wpEl) wpEl.innerHTML = winProbHtml(h, a);
  });

  updateLastUpdated();
  if(openPid) refreshOpenCard();
  firstPatchDone = true;
}

/* ---------- Player card (in-app popup; the only links out go to MFL) ---------- */
function playerCardHtml(p, c){
  const pos = p.pos || '';
  const g = c.game;
  let drive = '';
  if(g && g.state === 'in'){
    const clockStr = 'Q' + (g.quarter ?? '?') + ' ' + (g.clock ?? '');
    const dd = g.shortDownDistance ? ' &middot; ' + escapeHtml(g.shortDownDistance) : '';
    const leftLabel = g.homeAway === 'home' ? (g.opponent || '') : (g.selfAbbr || '');
    const rightLabel = g.homeAway === 'home' ? (g.selfAbbr || '') : (g.opponent || '');
    const ballLine = [
      g.possessionText ? 'Ball on ' + g.possessionText : '',
      g.lastPlayText || '',
    ].filter(Boolean).join(' &mdash; ');
    drive = `<div class="pm-drive">
      <div class="pm-drive-dd">
        <span>${escapeHtml(g.selfAbbr || p.nflTeam || '')} ${g.teamScore ?? 0} &ndash; ${g.oppScore ?? 0} ${escapeHtml(g.opponent || '')}</span>
        <span class="${g.redZone ? 'rz' : ''}">${g.redZone ? '&#9679; ' : ''}${escapeHtml(clockStr)}${dd}</span>
      </div>
      ${g.yardLine != null ? `<div class="pm-field"><span class="ball-marker" style="left:${Math.max(0, Math.min(100, g.yardLine))}%"></span></div>
      <div class="pm-field-labels"><span>${escapeHtml(leftLabel)}</span><span>${escapeHtml(rightLabel)}</span></div>` : ''}
      ${ballLine ? `<div class="pm-lastplay">${escapeHtml(ballLine.replace(/&mdash;/g, '—')).replace(/—/g, '&mdash;')}</div>` : ''}
    </div>`;
  }
  return `
      <button type="button" class="pm-close" id="pmClose" aria-label="Close">&times;</button>
      <div class="pm-head">
        <span class="pm-avatar" style="background:${avatarColor(p.name)}">${escapeHtml(initials(p.name))}</span>
        <div class="pm-id">
          <div class="pm-name">${escapeHtml(p.name)}</div>
          <div class="pm-meta">
            <span class="pos-tag pos-${escapeHtml(pos)}">${escapeHtml(pos)}</span>
            <span class="pm-team">${escapeHtml(p.nflTeam || 'FA')}</span>
          </div>
        </div>
        <div class="pm-points">${(c.points || 0).toFixed(1)}<span>PTS</span></div>
      </div>
      ${c.contextText ? `<div class="pm-status${c.contextLive ? ' live' : ''}">${escapeHtml(c.contextText)}</div>` : ''}
      <div class="pm-stats">${c.statLine ? escapeHtml(c.statLine) : 'No stats yet this week.'}</div>
      ${drive}
      <a class="pm-mfl" href="${MFL_LINEUP_URL}" target="_blank" rel="noopener">Manage lineup on MFL &nearr;</a>`;
}

function openPlayerCard(pid){
  const p = playerRegistry[pid];
  if(!p) return;
  openPid = pid;
  const modal = document.getElementById('playerModal');
  modal.innerHTML = `<div class="pm-backdrop" id="pmBackdrop">
    <div class="pm-card" role="dialog" aria-modal="true" aria-label="${escapeHtml(p.name)} player card">${playerCardHtml(p, computed[pid] || {})}</div>
  </div>`;
  document.getElementById('pmBackdrop').onclick = (e) => { if(e.target.id === 'pmBackdrop') closePlayerCard(); };
  document.getElementById('pmClose').onclick = closePlayerCard;
}
// Re-render just the card contents on each patch so an open card's points,
// drive info, and stat line move in real time too.
function refreshOpenCard(){
  const p = playerRegistry[openPid];
  const card = document.querySelector('#playerModal .pm-card');
  if(!p || !card){ openPid = null; return; }
  card.innerHTML = playerCardHtml(p, computed[openPid] || {});
  document.getElementById('pmClose').onclick = closePlayerCard;
}
function closePlayerCard(){
  openPid = null;
  document.getElementById('playerModal').innerHTML = '';
}
document.addEventListener('click', (e) => {
  const btn = e.target.closest('.js-player-card');
  if(btn) openPlayerCard(btn.dataset.playerId);
});
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape') closePlayerCard();
});

/* ---------- League feed (scoring plays involving rostered players) ---------- */
function renderTickerFull(newCount){
  const el = document.getElementById('ticker');
  if(!tickerEvents.length){ el.innerHTML = ''; return; }
  el.innerHTML = `<div class="ticker">
    <button type="button" class="ticker-head" id="tickerHead"><span class="tk-dot"></span>LEAGUE FEED<span class="tk-count">${tickerEvents.length}</span></button>
    <div class="ticker-list" id="tickerList"${tickerOpen ? '' : ' hidden'}>${tickerEvents.map((ev, idx) => `
      <div class="ticker-item${idx < newCount ? ' new' : ''}">
        <span class="tk-time">${escapeHtml(ev.when)}</span>
        <span class="tk-text">${ev.who.map((w) => `<span class="tk-who">${escapeHtml(w.name)}</span> <span class="tk-owner">${escapeHtml(w.owner)}</span>`).join(', ')} &mdash; ${escapeHtml(ev.text)}</span>
      </div>`).join('')}</div>
  </div>`;
  document.getElementById('tickerHead').onclick = () => {
    tickerOpen = !tickerOpen;
    document.getElementById('tickerList').hidden = !tickerOpen;
  };
}

function pushTickerEvents(events, animate){
  if(!events.length) return;
  tickerEvents = [...events, ...tickerEvents].slice(0, 40);
  renderTickerFull(animate ? events.length : 0);
}

// Pull new scoring plays out of a game summary and keep only the ones that
// name a rostered player (starter or bench, any team in the league).
function harvestScoringPlays(summary){
  const fresh = [];
  for(const play of summary.scoringPlays || []){
    const key = String(play.id || ((play.text || '') + ':' + (play.period && play.period.number)));
    if(seenPlays.has(key)) continue;
    seenPlays.add(key);
    const ntext = ' ' + normalizeName(play.text || '') + ' ';
    const who = [];
    for(const r of rosterIndex){
      if(r.norm && ntext.includes(' ' + r.norm + ' ') && !who.some((w) => w.name === r.name)){
        who.push({ name: r.name, owner: r.owner });
      }
    }
    if(!who.length) continue;
    fresh.push({
      when: `Q${(play.period && play.period.number) ?? '?'} ${(play.clock && play.clock.displayValue) || ''}`,
      text: ((play.team && play.team.abbreviation) ? play.team.abbreviation + ': ' : '') + (play.text || (play.type && play.type.text) || 'Score'),
      who: who.slice(0, 3),
    });
  }
  return fresh;
}

/* ---------- Banner ---------- */
function renderBanner(data){
  const bannerEl = document.getElementById('banner');
  if(data.status === 'unavailable' || data.status === 'not_started'){
    bannerEl.innerHTML = `<div class="banner info">${escapeHtml(data.message || "Live scoring isn't available until the season starts.")}</div>`;
  } else {
    bannerEl.innerHTML = `<div class="banner"><span><span class="dot"></span>Live &mdash; Week ${escapeHtml(data.week)}</span><span class="refresh-note">Updated <span id="lastUpdate">&mdash;</span></span></div>`;
    updateLastUpdated();
  }
}
function updateLastUpdated(){
  const el = document.getElementById('lastUpdate');
  if(el) el.textContent = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'});
}

// A stalled feed must never look like a quiet afternoon. Every successful
// ESPN pull stamps the clock; once we're two cadences past the last one, the
// banner says so instead of showing a frozen score as if it were current.
let lastEspnOk = 0;
let espnFailStreak = 0;
function markFeedHealth(ok){
  if(ok){ lastEspnOk = Date.now(); espnFailStreak = 0; }
  else espnFailStreak++;
  const dot = document.querySelector('#banner .dot');
  const note = document.querySelector('#banner .refresh-note');
  if(!dot || !note) return;
  const stale = espnFailStreak >= 2 || (lastEspnOk && Date.now() - lastEspnOk > 90000);
  const stamp = new Date(lastEspnOk || Date.now()).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'});
  dot.classList.toggle('stale', stale);
  // Rewritten on every transition in both directions — a recovered feed that
  // still reads "stalled" is exactly the lie this indicator exists to prevent.
  const html = stale
    ? `Feed stalled &mdash; retrying (last <span id="lastUpdate">${stamp}</span>)`
    : `Updated <span id="lastUpdate">${stamp}</span>`;
  if(note.dataset.state !== String(stale)){ note.innerHTML = html; note.dataset.state = String(stale); }
}

/* ---------- Orchestration: split-cadence polling engine ----------
   One master clock ticks every 2.5s and fires whichever fetches are due.
   The ESPN scoreboard runs hottest (10s while any NFL game is live) since
   one cheap request moves every score, clock, and drive situation on the
   page; box scores (one per live game) run at half that; MFL lineup data
   ambles at 2 minutes. Hidden tab = everything pauses; regaining focus
   forces an immediate full refresh. */
const sched = { lineup: 0, scoreboard: 0, box: 0 };
const inflight = { lineup: false, scoreboard: false, box: false };

function anyLive(){
  return Object.values(espnCache.gamesByTeam || {}).some((g) => g.state === 'in');
}

function recomputeAll(){
  if(!lineup) return;
  for(const p of allPlayersIn(lineup.matchups)){
    computed[p.id] = computePoints(p, espnCache.gamesByTeam, lineup.rules);
  }
}

async function refreshLineup(weekOverride){
  if(inflight.lineup) return;
  inflight.lineup = true;
  try{
    const w = weekOverride != null ? weekOverride : (currentWeek ?? '');
    const res = await fetch(`${LIVE_API_URL}?week=${w}`);
    const data = await res.json();
    lineup = data;
    currentWeek = data.week;
    renderBanner(data);
    renderWeekNav(data);
    const key = JSON.stringify([data.week, (data.matchups || []).map((m) => [
      m.home.franchiseId, (m.home.starters || []).map((p) => p.id), (m.home.bench || []).map((p) => p.id),
      m.away.franchiseId, (m.away.starters || []).map((p) => p.id), (m.away.bench || []).map((p) => p.id),
    ])]);
    if(key !== structuralKey){
      structuralKey = key;
      renderStructure();
    }
    patchDynamic();
  } catch(e){
    console.error('lineup fetch failed', e);
    if(!lineup){
      document.getElementById('banner').innerHTML = `<div class="banner"><span><span class="dot stale"></span>Couldn't reach the live scoreboard. Retrying&hellip;</span></div>`;
      sched.lineup = Date.now() + 10000; // retry sooner than the normal cadence
    }
  } finally {
    inflight.lineup = false;
  }
}

async function refreshScoreboard(){
  if(!lineup || demoMode || inflight.scoreboard) return;
  inflight.scoreboard = true;
  try{
    if(espnCache.week !== lineup.week) espnCache = { week: lineup.week, gamesByTeam: {}, boxByEvent: {} };
    espnCache.gamesByTeam = await loadEspnScoreboard(lineup.week, lineup.season);
    markFeedHealth(true);
    recomputeAll();
    patchDynamic();
    if(!Object.keys(espnCache.boxByEvent).length) sched.box = 0; // first sight of games: pull boxes now
  } catch(e){
    console.error('ESPN scoreboard failed', e);
    markFeedHealth(false);
  } finally {
    inflight.scoreboard = false;
  }
}

async function refreshBoxScores(){
  if(!lineup || demoMode || inflight.box) return;
  inflight.box = true;
  try{
    const needed = new Set();
    for(const p of allPlayersIn(lineup.matchups)){
      const abbr = p.nflTeam ? (MFL_TO_ESPN_TEAM[p.nflTeam] || p.nflTeam) : null;
      const g = abbr ? espnCache.gamesByTeam[abbr] : null;
      if(g && g.eventId && g.state !== 'pre') needed.add(g.eventId);
    }
    const freshEvents = [];
    await Promise.all([...needed].map(async (eventId) => {
      const existing = espnCache.boxByEvent[eventId];
      if(existing && existing.final) return; // finals never change; fetched once
      try{
        const summary = await espnJson(`${ESPN_SUMMARY}?event=${eventId}`);
        const final = !!(summary.header?.competitions?.[0]?.status?.type?.completed);
        espnCache.boxByEvent[eventId] = {
          summary,
          final,
          playerIndex: buildPlayerIndex(summary),
          fieldGoals: extractFieldGoalPlays(summary),
        };
        freshEvents.push(...harvestScoringPlays(summary));
      } catch(e){
        console.error('ESPN box score failed for event', eventId, e);
      }
    }));
    recomputeAll();
    patchDynamic();
    if(freshEvents.length){
      freshEvents.reverse(); // latest play first
      pushTickerEvents(freshEvents, tickerPrimed);
    }
    tickerPrimed = true;
  } finally {
    inflight.box = false;
  }
}

function tick(){
  if(demoMode || document.hidden) return;
  const now = Date.now();
  const live = anyLive();
  if(now >= sched.lineup){ sched.lineup = now + CADENCE.lineup; refreshLineup(); }
  if(lineup && now >= sched.scoreboard){ sched.scoreboard = now + (live ? CADENCE.sbLive : CADENCE.sbIdle); refreshScoreboard(); }
  if(lineup && now >= sched.box){ sched.box = now + (live ? CADENCE.boxLive : CADENCE.boxIdle); refreshBoxScores(); }
}

function loadWeek(week){
  slideIndex = 0;
  espnCache = { week: null, gamesByTeam: {}, boxByEvent: {} };
  computed = {};
  tickerEvents = [];
  seenPlays.clear();
  tickerPrimed = false;
  document.getElementById('banner').innerHTML = `<div class="banner"><span><span class="dot stale"></span>Loading week ${escapeHtml(week)}&hellip;</span></div>`;
  sched.lineup = Date.now() + CADENCE.lineup;
  sched.scoreboard = 0;
  sched.box = 0;
  refreshLineup(week).then(() => tick());
}

/* ---------- Boot ---------- */
if(new URLSearchParams(location.search).get('demo') === '1'){
  demoMode = true;
  renderDemo();
} else {
  document.getElementById('banner').innerHTML = `<div class="banner"><span><span class="dot stale"></span>Loading&hellip;</span></div>`;
  sched.lineup = Date.now() + CADENCE.lineup;
  refreshLineup().then(() => tick());
  setInterval(tick, 2500);
  document.addEventListener('visibilitychange', () => {
    if(!document.hidden){
      sched.scoreboard = 0;
      sched.box = 0;
      tick();
    }
  });
}
</script>
