<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Scoreboard — #ELITE</title>
<style>
@font-face{
  font-family:'Bebas Neue';
  font-style:normal;
  font-weight:400;
  font-display:swap;
  src:url(data:font/woff2;base64,{{FONT_BEBAS}}) format('woff2');
}
@font-face{
  font-family:'DM Mono';
  font-style:normal;
  font-weight:400;
  font-display:swap;
  src:url(data:font/woff2;base64,{{FONT_DMMONO400}}) format('woff2');
}
@font-face{
  font-family:'DM Mono';
  font-style:normal;
  font-weight:500;
  font-display:swap;
  src:url(data:font/woff2;base64,{{FONT_DMMONO500}}) format('woff2');
}
@font-face{
  font-family:'Inter';
  font-style:normal;
  font-weight:100 900;
  font-display:swap;
  src:url(data:font/woff2;base64,{{FONT_INTER}}) format('woff2');
}

:root{
  --bg:#edf1f8;
  --tile:#ffffff;
  --tile-hover:#f5f8fd;
  --ink:#1a1e35;
  --ink-dim:#666e93;
  --ink-faint:#9aa1c2;
  --border:#dde3f2;
  --border-soft:#e8ecf7;
  --red:#d5473b;
  --red-dim:#fbe6e3;
  --red-ink:#a5372e;
  --blue:#3059d6;
  --blue-dim:#e2e9fc;
  --blue-ink:#24449e;
  --pos-qb:#c96a2e;
  --pos-rb:#1f8f6f;
  --pos-wr:#7860c9;
  --pos-te:#c1508d;
  --pos-d:#5b6178;
  --good:#1f8f5b;
  --good-dim:#dcf2e6;
  --good-ink:#166b44;
  --warn:#a3791a;
  --warn-dim:#f7ecd2;
  --warn-ink:#7a5a10;
  --shadow:0 1px 2px rgba(26,30,53,0.04), 0 8px 24px -12px rgba(26,30,53,0.10);
}
:root[data-theme="dark"]{
  --bg:#0f1226;
  --tile:#181c38;
  --tile-hover:#1f2444;
  --ink:#eef0fb;
  --ink-dim:#a7addc;
  --ink-faint:#6f76a3;
  --border:#2a2f57;
  --border-soft:#232852;
  --red:#f0796d;
  --red-dim:rgba(240,121,109,0.14);
  --red-ink:#f7a89f;
  --blue:#7f9dff;
  --blue-dim:rgba(127,157,255,0.14);
  --blue-ink:#a9bdff;
  --pos-qb:#e08a4e;
  --pos-rb:#3fbf98;
  --pos-wr:#a08de8;
  --pos-te:#e17cb0;
  --pos-d:#8891b0;
  --good:#3fbf82;
  --good-dim:rgba(63,191,130,0.16);
  --good-ink:#8fe0b6;
  --warn:#e0b84e;
  --warn-dim:rgba(224,184,78,0.16);
  --warn-ink:#f0d38f;
  --shadow:0 1px 2px rgba(0,0,0,0.2), 0 8px 24px -12px rgba(0,0,0,0.4);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1226;
    --tile:#181c38;
    --tile-hover:#1f2444;
    --ink:#eef0fb;
    --ink-dim:#a7addc;
    --ink-faint:#6f76a3;
    --border:#2a2f57;
    --border-soft:#232852;
    --red:#f0796d;
    --red-dim:rgba(240,121,109,0.14);
    --red-ink:#f7a89f;
    --blue:#7f9dff;
    --blue-dim:rgba(127,157,255,0.14);
    --blue-ink:#a9bdff;
    --pos-qb:#e08a4e;
    --pos-rb:#3fbf98;
    --pos-wr:#a08de8;
    --pos-te:#e17cb0;
    --pos-d:#8891b0;
    --good:#3fbf82;
    --good-dim:rgba(63,191,130,0.16);
    --good-ink:#8fe0b6;
    --warn:#e0b84e;
    --warn-dim:rgba(224,184,78,0.16);
    --warn-ink:#f0d38f;
    --shadow:0 1px 2px rgba(0,0,0,0.2), 0 8px 24px -12px rgba(0,0,0,0.4);
  }
}

*{ box-sizing:border-box; }
html,body{ max-width:100%; overflow-x:hidden; }
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
.wrap{ max-width:1180px; margin:0 auto; padding:20px 16px 70px; }
a{ color:var(--blue); text-decoration:none; }
::selection{ background:var(--blue-dim); }

/* ---------- Header ---------- */
header{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding-bottom:16px;
  margin-bottom:18px;
  border-bottom:1px solid var(--border);
}
.brand{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
.eyebrow{
  font-family:'DM Mono',monospace;
  font-size:11px;
  letter-spacing:2px;
  color:var(--red);
  text-transform:uppercase;
  font-weight:500;
}
h1{
  font-family:'Bebas Neue',sans-serif;
  font-weight:400;
  font-size:32px;
  letter-spacing:0.5px;
  margin:0;
  line-height:1;
  text-transform:uppercase;
}
.header-right{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.nav-link, .theme-toggle{
  font-family:'DM Mono',monospace;
  font-size:11px;
  letter-spacing:0.5px;
  background:var(--tile);
  border:1px solid var(--border);
  color:var(--ink-dim);
  border-radius:20px;
  padding:6px 13px;
  cursor:pointer;
}
.nav-link:hover, .theme-toggle:hover{ color:var(--ink); border-color:var(--ink-faint); }

/* ---------- Status banner ---------- */
.banner{
  background:var(--tile);
  border:1px solid var(--border);
  border-radius:10px;
  padding:12px 16px;
  font-size:13px;
  color:var(--ink-dim);
  margin-bottom:18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
}
.banner b{ color:var(--ink); }
.banner.info{ background:var(--blue-dim); border-color:var(--blue-dim); }
.refresh-note{ font-family:'DM Mono',monospace; font-size:10.5px; color:var(--ink-faint); white-space:nowrap; }
.dot{ display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--good); margin-right:5px; }
.dot.stale{ background:var(--ink-faint); }

/* ---------- Empty state ---------- */
.empty{
  text-align:center;
  padding:60px 20px;
  color:var(--ink-dim);
}
.empty h2{ font-family:'Bebas Neue',sans-serif; font-size:26px; color:var(--ink); margin:0 0 8px; text-transform:uppercase; }

/* ---------- Week selector ---------- */
.week-nav{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  margin-bottom:16px;
}
.week-nav button{
  width:32px; height:32px;
  border-radius:50%;
  border:1px solid var(--border);
  background:var(--tile);
  color:var(--ink);
  font-size:16px;
  cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
.week-nav button:disabled{ opacity:0.35; cursor:default; }
.week-nav button:not(:disabled):hover{ border-color:var(--ink-faint); }
.week-nav select{
  font-family:'Bebas Neue',sans-serif;
  font-size:22px;
  letter-spacing:0.5px;
  text-transform:uppercase;
  background:var(--tile);
  color:var(--ink);
  border:1px solid var(--border);
  border-radius:20px;
  padding:4px 14px;
  cursor:pointer;
}

/* ---------- League-wide scoreboard strip ---------- */
.league-strip{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:2px 2px 4px;
  margin-bottom:16px;
  scrollbar-width:none;
}
.league-strip::-webkit-scrollbar{ display:none; }
.strip-pill{
  display:flex;
  align-items:center;
  gap:6px;
  flex-shrink:0;
  background:var(--tile);
  border:1px solid var(--border);
  border-radius:20px;
  padding:6px 12px;
  cursor:pointer;
  font-family:'DM Mono',monospace;
  font-size:12px;
  color:var(--ink-dim);
}
.strip-pill.active{ border-color:var(--red); }
.strip-pill:hover{ border-color:var(--ink-faint); }
.strip-avatar{
  width:20px; height:20px;
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-family:'Bebas Neue',sans-serif;
  font-size:9px;
  color:#fff;
  flex-shrink:0;
}
.strip-score{ font-weight:500; color:var(--ink); min-width:24px; text-align:center; }
.strip-score.lead{ color:var(--good); font-weight:700; }
.strip-vs{ color:var(--ink-faint); font-size:10px; }

/* ---------- Projections / win probability ---------- */
.matchup-team .proj{ font-family:'DM Mono',monospace; font-size:10.5px; color:var(--ink-faint); }
.matchup-winprob{
  display:flex;
  align-items:center;
  gap:8px;
  padding:0 16px 14px;
  font-family:'DM Mono',monospace;
  font-size:10.5px;
  color:var(--ink-faint);
}
.matchup-winprob .wp-pct{ min-width:32px; }
.matchup-winprob .wp-pct.away{ text-align:right; }
.winprob-bar{
  flex:1;
  height:6px;
  border-radius:4px;
  overflow:hidden;
  display:flex;
  background:var(--border-soft);
}
.winprob-bar .home-fill{ background:var(--blue); }
.winprob-bar .away-fill{ background:var(--red); }
.matchup-winprob.pending{ color:var(--ink-faint); font-style:italic; }

/* ---------- Matchup carousel ---------- */
.carousel-wrap{ position:relative; }
.carousel{
  display:flex;
  overflow-x:auto;
  scroll-snap-type:x mandatory;
  gap:14px;
  padding:2px 2px 6px;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.carousel::-webkit-scrollbar{ display:none; }
.matchup-slide{
  flex:0 0 100%;
  scroll-snap-align:center;
  min-width:0;
}
.carousel-arrow{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:36px; height:36px;
  border-radius:50%;
  border:1px solid var(--border);
  background:var(--tile);
  color:var(--ink);
  font-size:18px;
  cursor:pointer;
  box-shadow:var(--shadow);
  display:flex; align-items:center; justify-content:center;
  z-index:2;
}
.carousel-arrow.prev{ left:-14px; }
.carousel-arrow.next{ right:-14px; }
.carousel-arrow:disabled{ opacity:0; pointer-events:none; }
@media (max-width: 720px){ .carousel-arrow{ display:none; } }

.carousel-dots{
  display:flex;
  justify-content:center;
  gap:6px;
  margin-top:10px;
}
.carousel-dots .dotbtn{
  width:7px; height:7px;
  border-radius:50%;
  background:var(--border);
  border:none;
  padding:0;
  cursor:pointer;
}
.carousel-dots .dotbtn.active{ background:var(--red); width:16px; border-radius:4px; }

.matchup-card{
  background:var(--tile);
  border:1px solid var(--border);
  border-radius:12px;
  box-shadow:var(--shadow);
  overflow:hidden;
}
.matchup-score-row{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  padding:16px;
  gap:10px;
  border-bottom:1px solid var(--border-soft);
}
.matchup-team{ display:flex; flex-direction:column; gap:6px; min-width:0; }
.matchup-team.away{ align-items:flex-end; text-align:right; }
.team-id{ display:flex; align-items:center; gap:8px; min-width:0; }
.matchup-team.away .team-id{ flex-direction:row-reverse; }
.team-avatar{
  width:32px; height:32px;
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
  font-family:'Bebas Neue',sans-serif;
  font-size:13px;
  color:#fff;
  letter-spacing:0.5px;
}
.matchup-team .name{
  font-size:13.5px;
  font-weight:600;
  color:var(--ink-dim);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.matchup-team.leading .name{ color:var(--ink); }
.matchup-team .score{
  font-family:'Bebas Neue',sans-serif;
  font-size:38px;
  letter-spacing:0.3px;
  color:var(--ink-faint);
  line-height:1;
}
.matchup-team.leading .score{ color:var(--good); }
.matchup-vs{ font-family:'DM Mono',monospace; font-size:11px; color:var(--ink-faint); letter-spacing:1px; }

/* Starter rows: one row per roster slot, home player/score on the left,
   position pill in the middle, away score/player on the right — mirrors
   both teams' lineups side by side instead of two separate stacked lists. */
.starters-table{ padding:4px 0; position:relative; }
.starters-table::before{
  content:'';
  position:absolute;
  left:50%; top:0; bottom:0;
  width:1px;
  background:var(--border-soft);
}
.starter-row{
  display:grid;
  grid-template-columns:1fr auto auto auto 1fr;
  align-items:center;
  gap:6px;
  padding:9px 12px;
  border-bottom:1px solid var(--border-soft);
}
.starter-row:last-child{ border-bottom:none; }
.p-block{ min-width:0; }
.p-block.home{ text-align:right; }
.p-block.away{ text-align:left; }
.p-top{ display:flex; align-items:baseline; gap:5px; }
.p-block.home .p-top{ justify-content:flex-end; }
.p-block.away .p-top{ justify-content:flex-start; }
.p-name{
  font-size:12.5px;
  font-weight:600;
  color:var(--ink);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:130px;
}
a.p-name{ text-decoration:none; }
a.p-name:hover{ text-decoration:underline; }
.p-team{ font-family:'DM Mono',monospace; font-size:9.5px; color:var(--ink-faint); flex-shrink:0; }
.p-sub{ display:flex; flex-direction:column; gap:1px; margin-top:2px; }
.p-block.home .p-sub{ align-items:flex-end; }
.p-block.away .p-sub{ align-items:flex-start; }
.p-sub span, .p-sub a{
  font-family:'DM Mono',monospace;
  font-size:9.5px;
  color:var(--ink-faint);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:170px;
  text-decoration:none;
}
.p-sub a:hover{ text-decoration:underline; }
.p-sub .live, .p-sub a.live{ color:var(--red-ink); font-weight:600; }
.p-score{
  font-family:'Bebas Neue',sans-serif;
  font-size:19px;
  color:var(--ink);
  min-width:36px;
  text-align:center;
}
.pos-tag{
  font-family:'DM Mono',monospace;
  font-size:9.5px;
  font-weight:500;
  letter-spacing:0.5px;
  padding:2px 6px;
  border-radius:5px;
  flex-shrink:0;
  min-width:26px;
  text-align:center;
}
.pos-tag.pos-QB{ background:color-mix(in srgb, var(--pos-qb) 16%, transparent); color:var(--pos-qb); }
.pos-tag.pos-RB{ background:color-mix(in srgb, var(--pos-rb) 16%, transparent); color:var(--pos-rb); }
.pos-tag.pos-WR{ background:color-mix(in srgb, var(--pos-wr) 16%, transparent); color:var(--pos-wr); }
.pos-tag.pos-TE{ background:color-mix(in srgb, var(--pos-te) 16%, transparent); color:var(--pos-te); }
.pos-tag.pos-D{ background:color-mix(in srgb, var(--pos-d) 16%, transparent); color:var(--pos-d); }
.pos-tag.pos-PK{ background:color-mix(in srgb, var(--ink-dim) 16%, transparent); color:var(--ink-dim); }

@media (max-width: 480px){
  h1{ font-size:26px; }
  .matchup-team .score{ font-size:28px; }
  .p-name{ max-width:76px; font-size:11.5px; }
  .p-sub span{ max-width:88px; }
  .p-score{ font-size:16px; min-width:26px; }
  .pos-tag{ min-width:22px; font-size:8.5px; padding:2px 4px; }
  .starter-row{ padding:8px 6px; gap:4px; }
}
</style>
</head>

<script>

/* ---------- Helpers ---------- */
function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function normalizeName(s){
  return String(s || '')
    .toLowerCase()
    .replace(/\./g, '')
    .replace(/\b(jr|sr|ii|iii|iv|v)\b/g, '')
    .replace(/[^a-z\s'-]/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}

function lastNameOf(normName){
  const parts = normName.split(' ');
  return parts[parts.length - 1] || '';
}

/* ---------- MFL scoring, computed client-side from ESPN stats ---------- */
// Mirrors worker/src/index.js scoreStatLine() exactly — same {event: count}
// input shape, same tiered/per-unit rule format from TYPE=rules.
function scoreStatLine(stats, fgDistances, eventRules){
  let total = 0;
  for(const [event, count] of Object.entries(stats || {})){
    const tiers = eventRules && eventRules[event];
    if(!tiers || !count) continue;
    for(const tier of tiers){
      if(count < tier.min || count > tier.max) continue;
      total += tier.perUnit ? tier.points * count : tier.points;
      if(!tier.perUnit) break;
    }
  }
  const fgTiers = eventRules && eventRules.FG;
  if(fgTiers){
    for(const dist of fgDistances || []){
      const tier = fgTiers.find((t) => dist >= t.min && dist <= t.max);
      if(tier) total += tier.points;
    }
  }
  return total;
}

/* ---------- ESPN: scoreboard + box scores ---------- */
let espnCache = { week: null, gamesByTeam: {}, boxByEvent: {} };

async function espnJson(url){
  const res = await fetch(url);
  if(!res.ok) throw new Error('ESPN ' + res.status);
  return res.json();
}

// One scoreboard call for the whole NFL week gives us every game's state
// (quarter/clock/redzone/score) keyed by team abbreviation.
async function loadEspnScoreboard(nflWeek, season){
  const url = `${ESPN_SCOREBOARD}?week=${nflWeek}&year=${season}&seasontype=2`;
  const data = await espnJson(url);
  const gamesByTeam = {};
  for(const event of data.events || []){
    const comp = event.competitions && event.competitions[0];
    if(!comp) continue;
    const status = comp.status || {};
    const situation = comp.situation || {};
    const [a, b] = comp.competitors || [];
    if(!a || !b) continue;
    const build = (self, opp) => ({
      eventId: event.id,
      opponent: opp.team && opp.team.abbreviation,
      quarter: status.period ?? null,
      clock: status.displayClock ?? null,
      state: status.type && status.type.state, // "pre" | "in" | "post"
      final: !!(status.type && status.type.completed),
      redZone: !!situation.isRedZone,
      teamScore: Number(self.score) || 0,
      oppScore: Number(opp.score) || 0,
      teamId: self.team && self.team.id,
      oppId: opp.team && opp.team.id,
    });
    if(a.team && a.team.abbreviation) gamesByTeam[a.team.abbreviation] = build(a, b);
    if(b.team && b.team.abbreviation) gamesByTeam[b.team.abbreviation] = build(b, a);
  }
  return gamesByTeam;
}

// Field goals are scored by distance tier, but ESPN's box score only gives
// an aggregate "made/attempted" string — so distances come from the play
// log instead, matched back to the kicker by the "X.Lastname" in the text.
function extractFieldGoalPlays(summary){
  const drives = (summary.drives && summary.drives.previous) || [];
  const kicks = [];
  for(const drive of drives){
    for(const play of (drive.plays || [])){
      const typeText = play.type && play.type.text;
      if(typeText !== 'Field Goal Good') continue;
      const desc = play.text || '';
      const nameMatch = desc.match(/^([A-Z][A-Za-z'-]*\.?\s?[A-Z][A-Za-z'-]+)/);
      const distMatch = desc.match(/(\d+)\s+yard field goal/i);
      const distance = play.statYardage != null ? Number(play.statYardage) : (distMatch ? Number(distMatch[1]) : null);
      if(distance != null) kicks.push({ rawName: nameMatch ? nameMatch[1] : '', distance });
    }
  }
  return kicks;
}

// Builds a per-player stat index for one game: normalized name -> merged
// {labelValue(category,label)} lookup across every stat category ESPN
// returns for that player (a WR can show up under both receiving and
// rushing, etc).
function buildPlayerIndex(summary){
  const index = {}; // normName -> { categories: {name: {labels, values}}, teamAbbr }
  const teamEntries = (summary.boxscore && summary.boxscore.players) || [];
  for(const teamEntry of teamEntries){
    const teamAbbr = teamEntry.team && teamEntry.team.abbreviation;
    for(const cat of teamEntry.statistics || []){
      for(const ath of cat.athletes || []){
        const displayName = ath.athlete && ath.athlete.displayName;
        if(!displayName) continue;
        const key = normalizeName(displayName);
        if(!index[key]) index[key] = { categories: {}, teamAbbr, athleteId: (ath.athlete && ath.athlete.id) || null };
        index[key].categories[cat.name] = { labels: cat.labels || [], values: ath.stats || [] };
      }
    }
  }
  return index;
}

function labelValue(categories, catName, label){
  const cat = categories[catName];
  if(!cat) return null;
  const idx = cat.labels.indexOf(label);
  if(idx === -1) return null;
  return cat.values[idx];
}

function findPlayer(index, mflName){
  const norm = normalizeName(mflName);
  if(index[norm]) return index[norm];
  // Fallback: last name + first-initial match, for minor formatting drift
  // between MFL's "Firstname Lastname" and ESPN's displayName.
  const [first, ...rest] = norm.split(' ');
  const last = rest[rest.length - 1] || first;
  const firstInitial = (first || '')[0];
  for(const key of Object.keys(index)){
    if(lastNameOf(key) === last && key[0] === firstInitial) return index[key];
  }
  return null;
}

// Offense (QB/RB/WR/TE/PK): computed directly from the player's own box
// score stat lines. FG/EP handled separately since MFL scores them by
// distance/count rather than a simple per-yard rate.
function offenseStats(categories){
  const stats = {};
  const num = (v) => { const n = Number(v); return Number.isFinite(n) ? n : 0; };
  const passYds = num(labelValue(categories, 'passing', 'YDS'));
  const passTD = num(labelValue(categories, 'passing', 'TD'));
  const passInt = num(labelValue(categories, 'passing', 'INT'));
  if(passYds) stats.PY = passYds;
  if(passTD) stats['#P'] = passTD;
  if(passInt) stats.IN = passInt;

  const rushYds = num(labelValue(categories, 'rushing', 'YDS'));
  const rushTD = num(labelValue(categories, 'rushing', 'TD'));
  if(rushYds) stats.RY = rushYds;
  if(rushTD) stats['#R'] = rushTD;

  const rec = num(labelValue(categories, 'receiving', 'REC'));
  const recYds = num(labelValue(categories, 'receiving', 'YDS'));
  const recTD = num(labelValue(categories, 'receiving', 'TD'));
  if(rec) stats.CC = rec;
  if(recYds) stats.CY = recYds;
  if(recTD) stats['#C'] = recTD;

  const fumLost = num(labelValue(categories, 'fumbles', 'LOST'));
  if(fumLost) stats.FL = fumLost;

  const krTD = num(labelValue(categories, 'kickReturns', 'TD'));
  const prTD = num(labelValue(categories, 'puntReturns', 'TD'));
  if(krTD) stats['#KT'] = krTD;
  if(prTD) stats['#UT'] = prTD;

  return stats;
}

// Defense (Def/DST slot): points-allowed, sacks and interceptions come
// straight out of ESPN's structured box score, so those are exact. Forced
// fumbles, blocked kicks, safeties and D/ST touchdowns aren't exposed as
// clean per-team fields in this box score — rather than guess at them from
// play-by-play text and risk being wrong, they're left at 0 for now. Known
// gap, flagged rather than silently approximated.
function defenseStats(summary, teamAbbr, teamId, oppScore){
  const stats = {};
  const teamEntries = (summary.boxscore && summary.boxscore.players) || [];
  const teamEntry = teamEntries.find((t) => (t.team && (t.team.id === teamId || t.team.abbreviation === teamAbbr)));
  const catByName = {};
  for(const cat of (teamEntry && teamEntry.statistics) || []) catByName[cat.name] = cat;
  const sumLabel = (catName, label) => {
    const cat = catByName[catName];
    if(!cat) return 0;
    const idx = cat.labels.indexOf(label);
    if(idx === -1) return 0;
    let sum = 0;
    for(const ath of cat.athletes || []){
      const v = parseFloat(ath.stats && ath.stats[idx]);
      if(!Number.isNaN(v)) sum += v;
    }
    return sum;
  };
  const sacks = sumLabel('defensive', 'SACKS');
  if(sacks) stats.SK = sacks;
  const picks = sumLabel('interceptions', 'INT');
  if(picks) stats.IC = picks;
  if(oppScore != null) stats.TPA = oppScore; // tiered range lookup happens in scoreStatLine via FG-style bare-number ranges
  return stats;
}

// Turns the raw {EVENT_CODE: count} stat object into a short human-readable
// line, e.g. "257 YD, 3 TD, 1 INT" or "3 SACK, 1 INT, 24 PA". Offense and
// defense codes never overlap on one player, so one formatter covers both.
function formatStatSummary(stats){
  if(!stats) return '';
  const parts = [];
  const round = (n) => Math.round(n * 10) / 10;
  if(stats._FG) parts.push(stats._FG + ' FG');
  if(stats.PY) parts.push(round(stats.PY) + ' YD');
  if(stats['#P']) parts.push(stats['#P'] + ' TD');
  if(stats.IN) parts.push(stats.IN + ' INT');
  if(stats.RY) parts.push(round(stats.RY) + ' YD');
  if(stats['#R']) parts.push(stats['#R'] + ' TD');
  if(stats.CC) parts.push(stats.CC + ' REC');
  if(stats.CY) parts.push(round(stats.CY) + ' YD');
  if(stats['#C']) parts.push(stats['#C'] + ' TD');
  if(stats.FL) parts.push(stats.FL + ' FUM');
  if(stats.EP) parts.push(stats.EP + ' XP');
  if(stats.SK) parts.push(stats.SK + ' SACK');
  if(stats.IC) parts.push(stats.IC + ' INT');
  if(stats.TPA != null) parts.push(stats.TPA + ' PA');
  return parts.join(', ');
}

// The small gray line under a player's name: live clock, final score, or
// pregame — same shape whether it's a real ESPN game object or demo data.
function gameContextText(game){
  if(!game) return '';
  if(game.final) return `Final · ${game.teamScore}-${game.oppScore}`;
  if(game.state === 'pre') return 'Pregame';
  if(game.state === 'in'){
    const rz = game.redZone ? '● ' : '';
    return rz + 'Q' + (game.quarter ?? '?') + ' ' + (game.clock ?? '');
  }
  return '';
}

// Every player/DST name and every game-status line links out to ESPN so you
// can follow along live — direct player/gamecast pages when we've resolved
// a real ESPN id, falling back to a name search when we haven't (yet, or a
// player ESPN just doesn't have deep-linkable, e.g. inactive all game).
function espnPlayerUrl(athleteId, name){
  if(athleteId) return `https://www.espn.com/nfl/player/_/id/${athleteId}`;
  return `https://www.espn.com/search/_/q/${encodeURIComponent(name)}`;
}
function espnTeamUrl(espnAbbr){
  return `https://www.espn.com/nfl/team/_/name/${(espnAbbr || '').toLowerCase()}`;
}
function espnGameUrl(eventId){
  return eventId ? `https://www.espn.com/nfl/game/_/gameId/${eventId}` : null;
}

/* ---------- Per-player point computation ---------- */
function computePoints(player, gamesByTeam, rules){
  const espnAbbr = player.nflTeam ? (MFL_TO_ESPN_TEAM[player.nflTeam] || player.nflTeam) : null;
  const game = espnAbbr ? gamesByTeam[espnAbbr] : null;
  const ruleKey = POS_TO_RULE_KEY[player.pos] || player.pos;
  const eventRules = rules && rules[ruleKey];
  const result = {
    points: 0,
    game: game || null,
    contextText: gameContextText(game),
    contextLive: !!(game && game.state === 'in'),
    statLine: '',
    playerHref: player.pos === 'D' ? espnTeamUrl(espnAbbr) : espnPlayerUrl(null, player.name),
    gameHref: espnGameUrl(game && game.eventId),
  };
  if(!game || !game.eventId || !eventRules) return result;

  const box = espnCache.boxByEvent[game.eventId];
  if(!box) return result; // box score for this game hasn't loaded yet

  if(player.pos === 'D'){
    const stats = defenseStats(box.summary, espnAbbr, game.teamId, game.oppScore);
    result.points = scoreStatLine(stats, [], eventRules);
    result.statLine = formatStatSummary(stats);
    return result;
  }

  const rec = findPlayer(box.playerIndex, player.name);
  if(!rec) return result; // inactive, bye, or a name we couldn't match
  result.playerHref = espnPlayerUrl(rec.athleteId, player.name);

  const stats = offenseStats(rec.categories);
  const fgDistances = [];
  if(player.pos === 'PK'){
    const xp = Number(labelValue(rec.categories, 'kicking', 'XP')?.split('/')[0]) || 0;
    if(xp) stats.EP = xp;
    const kicks = box.fieldGoals.filter((k) => lastNameOf(normalizeName(k.rawName)) === lastNameOf(normalizeName(player.name)));
    fgDistances.push(...kicks.map((k) => k.distance));
    if(fgDistances.length) stats._FG = fgDistances.length; // display-only, not a scoring event
  }
  result.points = scoreStatLine(stats, fgDistances, eventRules);
  result.statLine = formatStatSummary(stats);
  return result;
}

/* ---------- State ---------- */
let currentData = null; // last /api/live-scores payload
let currentWeek = null;
let slideIndex = 0;

/* ---------- Rendering ---------- */
function initials(name){
  const words = String(name || '').split(/\s+/).filter(Boolean);
  return (words.map((w) => w[0]).join('').slice(0, 2) || '?').toUpperCase();
}
function avatarColor(name){
  let hash = 0;
  for(let i = 0; i < name.length; i++) hash = (hash * 31 + name.charCodeAt(i)) >>> 0;
  return `hsl(${hash % 360} 50% 42%)`;
}

function playerBlock(p, computed, side){
  const c = computed || { points: 0, contextText: '', contextLive: false, statLine: '', playerHref: null, gameHref: null };
  const nameEl = c.playerHref
    ? `<a class="p-name" href="${escapeHtml(c.playerHref)}" target="_blank" rel="noopener">${escapeHtml(p.name)}</a>`
    : `<span class="p-name">${escapeHtml(p.name)}</span>`;
  const teamEl = `<span class="p-team">${escapeHtml(p.nflTeam || '')}</span>`;
  const top = side === 'home' ? nameEl + teamEl : teamEl + nameEl;
  const contextEl = c.contextText
    ? (c.gameHref
        ? `<a class="game-link${c.contextLive ? ' live' : ''}" href="${escapeHtml(c.gameHref)}" target="_blank" rel="noopener">${escapeHtml(c.contextText)}</a>`
        : `<span${c.contextLive ? ' class="live"' : ''}>${escapeHtml(c.contextText)}</span>`)
    : '';
  return `<div class="p-block ${side}">
    <div class="p-top">${top}</div>
    <div class="p-sub">
      ${contextEl}
      ${c.statLine ? `<span>${escapeHtml(c.statLine)}</span>` : ''}
    </div>
  </div>`;
}

function starterRow(homePlayer, awayPlayer, computedByPlayerId){
  const pos = (homePlayer || awayPlayer).pos || '';
  const hc = homePlayer ? computedByPlayerId[homePlayer.id] : null;
  const ac = awayPlayer ? computedByPlayerId[awayPlayer.id] : null;
  return `<div class="starter-row">
    ${homePlayer ? playerBlock(homePlayer, hc, 'home') : '<div class="p-block home"></div>'}
    <span class="p-score">${homePlayer ? (hc?.points || 0).toFixed(1) : '—'}</span>
    <span class="pos-tag pos-${escapeHtml(pos)}">${escapeHtml(pos)}</span>
    <span class="p-score">${awayPlayer ? (ac?.points || 0).toFixed(1) : '—'}</span>
    ${awayPlayer ? playerBlock(awayPlayer, ac, 'away') : '<div class="p-block away"></div>'}
  </div>`;
}

function teamScore(team, computedByPlayerId){
  return team.starters.reduce((sum, p) => sum + ((computedByPlayerId[p.id] && computedByPlayerId[p.id].points) || 0), 0);
}

// Win% here is a simple projected-total ratio (homeProj / (homeProj +
// awayProj)), not a real statistical model — placeholder until we have a
// real projections source to compute something more rigorous from (e.g.
// factoring in this league's actual week-to-week score variance).
function winProbHtml(m){
  if(m.projHome == null || m.projAway == null){
    return `<div class="matchup-winprob pending">Win% needs live projections &mdash; not wired up yet</div>`;
  }
  const total = m.projHome + m.projAway;
  const homePct = total > 0 ? Math.round((m.projHome / total) * 100) : 50;
  const awayPct = 100 - homePct;
  return `<div class="matchup-winprob">
    <span class="wp-pct home">${homePct}%</span>
    <div class="winprob-bar"><span class="home-fill" style="width:${homePct}%"></span><span class="away-fill" style="width:${awayPct}%"></span></div>
    <span class="wp-pct away">${awayPct}%</span>
  </div>`;
}

function renderMatchup(m, computedByPlayerId){
  const homeScore = teamScore(m.home, computedByPlayerId);
  const awayScore = teamScore(m.away, computedByPlayerId);
  const homeLead = homeScore > awayScore;
  const awayLead = awayScore > homeScore;
  const rowCount = Math.max(m.home.starters.length, m.away.starters.length);
  const rows = Array.from({ length: rowCount }, (_, i) => starterRow(m.home.starters[i], m.away.starters[i], computedByPlayerId)).join('');
  return `<div class="matchup-slide"><div class="matchup-card">
    <div class="matchup-score-row">
      <div class="matchup-team home${homeLead ? ' leading' : ''}">
        <div class="team-id">
          <span class="team-avatar" style="background:${avatarColor(m.home.team)}">${escapeHtml(initials(m.home.team))}</span>
          <span class="name">${escapeHtml(m.home.team)}</span>
        </div>
        <span class="score">${homeScore.toFixed(1)}</span>
        ${m.projHome != null ? `<span class="proj">Proj ${m.projHome.toFixed(1)}</span>` : ''}
      </div>
      <span class="matchup-vs">VS</span>
      <div class="matchup-team away${awayLead ? ' leading' : ''}">
        <div class="team-id">
          <span class="team-avatar" style="background:${avatarColor(m.away.team)}">${escapeHtml(initials(m.away.team))}</span>
          <span class="name">${escapeHtml(m.away.team)}</span>
        </div>
        <span class="score">${awayScore.toFixed(1)}</span>
        ${m.projAway != null ? `<span class="proj">Proj ${m.projAway.toFixed(1)}</span>` : ''}
      </div>
    </div>
    ${winProbHtml(m)}
    <div class="starters-table">${rows || '<div class="starter-row">No starters yet</div>'}</div>
  </div></div>`;
}

function renderLeagueStrip(matchups, computedByPlayerId){
  const strip = document.getElementById('leagueStrip');
  if(!matchups.length){ strip.innerHTML = ''; return; }
  strip.innerHTML = `<div class="league-strip">${matchups.map((m, i) => {
    const homeScore = teamScore(m.home, computedByPlayerId);
    const awayScore = teamScore(m.away, computedByPlayerId);
    return `<button class="strip-pill${i === slideIndex ? ' active' : ''}" data-i="${i}">
      <span class="strip-avatar" style="background:${avatarColor(m.home.team)}">${escapeHtml(initials(m.home.team))}</span>
      <span class="strip-score${homeScore > awayScore ? ' lead' : ''}">${homeScore.toFixed(1)}</span>
      <span class="strip-vs">&middot;</span>
      <span class="strip-score${awayScore > homeScore ? ' lead' : ''}">${awayScore.toFixed(1)}</span>
      <span class="strip-avatar" style="background:${avatarColor(m.away.team)}">${escapeHtml(initials(m.away.team))}</span>
    </button>`;
  }).join('')}</div>`;
  strip.querySelectorAll('.strip-pill').forEach((btn) => {
    btn.onclick = () => scrollToSlide(Number(btn.dataset.i));
  });
}

// Shared by the league strip, the carousel's own dots, and its arrows —
// whichever one triggers navigation, all three stay in sync.
function scrollToSlide(i){
  const carouselEl = document.getElementById('carousel');
  if(!carouselEl) return;
  const slides = carouselEl.querySelectorAll('.matchup-slide');
  if(!slides.length) return;
  slideIndex = Math.max(0, Math.min(slides.length - 1, i));
  slides[slideIndex].scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
  document.querySelectorAll('.dotbtn').forEach((b, idx) => b.classList.toggle('active', idx === slideIndex));
  document.querySelectorAll('.strip-pill').forEach((b, idx) => b.classList.toggle('active', idx === slideIndex));
}

function renderWeekNav(data){
  const nav = document.getElementById('weekNav');
  if(!data.totalWeeks){ nav.innerHTML = ''; return; }
  const options = Array.from({length: data.totalWeeks}, (_, i) => i + 1)
    .map((w) => `<option value="${w}"${w === data.week ? ' selected' : ''}>Week ${w}</option>`)
    .join('');
  nav.innerHTML = `<div class="week-nav">
    <button id="weekPrev" ${data.week <= 1 ? 'disabled' : ''}>&lsaquo;</button>
    <select id="weekSelect">${options}</select>
    <button id="weekNext" ${data.week >= data.totalWeeks ? 'disabled' : ''}>&rsaquo;</button>
  </div>`;
  document.getElementById('weekPrev').onclick = () => loadWeek(data.week - 1);
  document.getElementById('weekNext').onclick = () => loadWeek(data.week + 1);
  document.getElementById('weekSelect').onchange = (e) => loadWeek(Number(e.target.value));
}

function renderCarousel(matchups, computedByPlayerId){
  const contentEl = document.getElementById('content');
  if(!matchups.length){
    contentEl.innerHTML = `<div class="empty"><h2>No matchups to show yet</h2><p>Check back once the week's games are set.</p></div>`;
    return;
  }
  const dots = matchups.map((_, i) => `<button class="dotbtn${i === slideIndex ? ' active' : ''}" data-i="${i}"></button>`).join('');
  contentEl.innerHTML = `<div class="carousel-wrap">
    <button class="carousel-arrow prev" id="arrowPrev">&lsaquo;</button>
    <div class="carousel" id="carousel">${matchups.map((m) => renderMatchup(m, computedByPlayerId)).join('')}</div>
    <button class="carousel-arrow next" id="arrowNext">&rsaquo;</button>
  </div>
  ${matchups.length > 1 ? `<div class="carousel-dots">${dots}</div>` : ''}`;

  const carouselEl = document.getElementById('carousel');
  const slides = carouselEl.querySelectorAll('.matchup-slide');
  document.getElementById('arrowPrev').onclick = () => scrollToSlide(slideIndex - 1);
  document.getElementById('arrowNext').onclick = () => scrollToSlide(slideIndex + 1);
  document.querySelectorAll('.dotbtn').forEach((btn) => {
    btn.onclick = () => scrollToSlide(Number(btn.dataset.i));
  });
  let scrollTimer;
  carouselEl.onscroll = () => {
    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(() => {
      const mid = carouselEl.scrollLeft + carouselEl.clientWidth / 2;
      let closest = 0, closestDist = Infinity;
      slides.forEach((s, i) => {
        const dist = Math.abs((s.offsetLeft + s.clientWidth / 2) - mid);
        if(dist < closestDist){ closestDist = dist; closest = i; }
      });
      if(closest !== slideIndex){
        slideIndex = closest;
        document.querySelectorAll('.dotbtn').forEach((b, i) => b.classList.toggle('active', i === slideIndex));
        document.querySelectorAll('.strip-pill').forEach((b, i) => b.classList.toggle('active', i === slideIndex));
      }
    }, 100);
  };
  scrollToSlide(Math.min(slideIndex, matchups.length - 1));
}

function renderBanner(data){
  const bannerEl = document.getElementById('banner');
  if(data.status === 'unavailable' || data.status === 'not_started'){
    bannerEl.innerHTML = `<div class="banner info">${escapeHtml(data.message || "Live scoring isn't available until the season starts.")}</div>`;
  } else {
    const now = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    bannerEl.innerHTML = `<div class="banner"><span><span class="dot"></span>Live &mdash; Week ${escapeHtml(data.week)}</span><span class="refresh-note">Updated ${now}</span></div>`;
  }
}

/* ---------- Orchestration ---------- */
async function loadEspnAndRender(data){
  const computedByPlayerId = {};
  const allPlayers = data.matchups.flatMap((m) => [...m.home.starters, ...m.away.starters]);

  try{
    // Scoreboard is cheap (one call for the whole week) and drives game
    // clock/redzone, so it's refetched every poll regardless of week.
    if(espnCache.week !== data.week) espnCache = { week: data.week, gamesByTeam: {}, boxByEvent: {} };
    espnCache.gamesByTeam = await loadEspnScoreboard(data.week, data.season);

    const neededEventIds = new Set();
    for(const p of allPlayers){
      const abbr = p.nflTeam ? (MFL_TO_ESPN_TEAM[p.nflTeam] || p.nflTeam) : null;
      const game = abbr ? espnCache.gamesByTeam[abbr] : null;
      if(game && game.eventId) neededEventIds.add(game.eventId);
    }

    // Box scores are heavier, so only (re)fetch a game that's still live —
    // final/pregame games don't need re-pulling every poll.
    await Promise.all([...neededEventIds].map(async (eventId) => {
      const existing = espnCache.boxByEvent[eventId];
      if(existing && existing.final) return;
      try{
        const summary = await espnJson(`${ESPN_SUMMARY}?event=${eventId}`);
        const final = !!(summary.header?.competitions?.[0]?.status?.type?.completed);
        espnCache.boxByEvent[eventId] = {
          summary,
          final,
          playerIndex: buildPlayerIndex(summary),
          fieldGoals: extractFieldGoalPlays(summary),
        };
      } catch(e){
        console.error('ESPN box score failed for event', eventId, e);
      }
    }));
  } catch(e){
    console.error('ESPN scoreboard failed', e);
  }

  for(const p of allPlayers){
    computedByPlayerId[p.id] = computePoints(p, espnCache.gamesByTeam, data.rules);
  }

  renderLeagueStrip(data.matchups, computedByPlayerId);
  renderCarousel(data.matchups, computedByPlayerId);
}

async function loadWeek(week){
  slideIndex = 0;
  const bannerEl = document.getElementById('banner');
  const loadingLabel = week ? `Loading week ${escapeHtml(week)}` : 'Loading';
  bannerEl.innerHTML = `<div class="banner"><span><span class="dot stale"></span>${loadingLabel}&hellip;</span></div>`;
  try{
    const res = await fetch(`${LIVE_API_URL}?week=${week}`);
    const data = await res.json();
    currentData = data;
    currentWeek = data.week;
    renderBanner(data);
    renderWeekNav(data);
    if(data.matchups && data.matchups.length){
      await loadEspnAndRender(data);
    } else {
      document.getElementById('content').innerHTML = `<div class="empty"><h2>No matchups to show yet</h2><p>Check back once the week's games are set.</p></div>`;
    }
  } catch(e){
    bannerEl.innerHTML = `<div class="banner"><span><span class="dot stale"></span>Couldn't reach the live scoreboard. Retrying&hellip;</span></div>`;
  }
}

async function poll(){
  if(currentWeek == null){ await loadWeek(''); return; } // '' lets the API pick the current week
  await loadWeek(currentWeek);
}

if(new URLSearchParams(location.search).get('demo') === '1'){
  renderDemo();
} else {
  poll();
  setInterval(poll, POLL_MS);
}
</script>
